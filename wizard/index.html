<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PETG Dial-In Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Prusa Design System tokens (Brand Manual v1.0; EIT surface). Light first, dark below. */
:root{
  --paper:#F7F7F7; --sheet:#FFFFFF; --rail:#F0F0F0; --line:#E5E5E5; --line-soft:#F0F0F0;
  --ink:#111111; --ink-2:#333333; --ink-3:#666666;
  --accent:#FD5000; --accent-hover:#E04500; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.10);
  --good:#008555; --good-soft:rgba(0,196,141,.10); --warn:#7A6800; --warn-soft:rgba(255,220,0,.18); --bad:#A00000; --bad-soft:rgba(237,0,0,.10);
  --focus:#346EF4; --shadow-sm:0 1px 2px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.18);
  --display:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --data:"Inter Tight","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --dur-fast:120ms; --dur-base:180ms; --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121212; --sheet:#1E1E1E; --rail:#1A1A1A; --line:#2E2E2E; --line-soft:#262626;
    --ink:#FFFFFF; --ink-2:#E0E0E0; --ink-3:#B0B0B0;
    --accent:#FD5000; --accent-hover:#FD8333; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.18);
    --good:#00C48D; --good-soft:rgba(0,196,141,.18); --warn:#FFE044; --warn-soft:rgba(255,220,0,.18); --bad:#FF4444; --bad-soft:rgba(237,0,0,.18);
    --focus:#5C8CF8; --shadow-sm:none; --shadow-lg:0 18px 40px rgba(0,0,0,.70);
  }
}
:root[data-theme="dark"]{
  --paper:#121212; --sheet:#1E1E1E; --rail:#1A1A1A; --line:#2E2E2E; --line-soft:#262626;
  --ink:#FFFFFF; --ink-2:#E0E0E0; --ink-3:#B0B0B0;
  --accent:#FD5000; --accent-hover:#FD8333; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.18);
  --good:#00C48D; --good-soft:rgba(0,196,141,.18); --warn:#FFE044; --warn-soft:rgba(255,220,0,.18); --bad:#FF4444; --bad-soft:rgba(237,0,0,.18);
  --focus:#5C8CF8; --shadow-sm:none; --shadow-lg:0 18px 40px rgba(0,0,0,.70);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 16px 28px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.05;text-transform:uppercase}
.brand .model{color:var(--accent)}
.brand small{display:block;font-family:var(--data);font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.eyebrow{font-family:var(--data);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.printer-list{display:flex;flex-direction:column;gap:4px}
.printer-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 12px;min-height:44px;cursor:pointer;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.printer-btn:hover{background:var(--sheet)}
.printer-btn[aria-current="true"]{background:var(--sheet);border-color:var(--line)}
.printer-btn .tag{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.steps{display:flex;flex-direction:column;gap:2px}
.step-btn{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px;min-height:40px;cursor:pointer;color:var(--ink-2);transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.step-btn:hover{background:var(--sheet)}
.step-btn[aria-current="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink)}
.step-btn .num{font-family:var(--display);font-weight:600;font-size:20px;line-height:1;color:var(--ink-3)}
.step-btn[aria-current="true"] .num{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--good)}
.dot.partial{background:var(--warn)}
.rail-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink);transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:hover{border-color:var(--ink-3);background:var(--paper)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
main{padding:28px 32px 64px;max-width:1040px;width:100%}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.sheet-head h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.sheet-head h1 .n{color:var(--accent);margin-right:10px}
.sheet-head .who{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
.sheet-head .who b{color:var(--ink);font-weight:500}
.purpose{max-width:66ch;color:var(--ink-2);margin:0 0 22px;font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.block{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm)}
.block h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;text-transform:none;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.block h2 .k{font-family:var(--data);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.bed{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 12px}
.cmd{font-family:var(--mono);font-size:13px;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;margin:0 0 12px;word-break:break-word}
table.vals{width:100%;border-collapse:collapse;font-size:13.5px}
table.vals td{padding:5px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.vals td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:12px}
table.vals tr:last-child td{border-bottom:0}
.look{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.look li{margin:4px 0}
.fields{display:grid;grid-template-columns:1fr;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:12px}
.field label{font-size:13.5px}
.field label small{display:block;color:var(--ink-3);font-size:12px}
.field .in{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.field input[type=number],.field input[type=text],.field select{width:100%;max-width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-family:var(--mono);font-size:13.5px;text-align:right}
.field input[type=text]{font-family:var(--body);text-align:left}
.field .unit{font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:34px}
.field.wide{grid-template-columns:1fr}
.field.wide input[type=text]{max-width:none}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.res:last-child{border-bottom:0}
.res .l{font-size:13.5px}
.res .l small{display:block;color:var(--ink-3);font-size:12px}
.res .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .v.big{font-size:26px;color:var(--accent)}
.res .v.muted{color:var(--ink-3);font-size:14px}
.pill{display:inline-block;font-family:var(--data);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.step-btn .pill{margin-left:6px;font-size:10px;padding:1px 6px;vertical-align:1px}
.step-btn>span:nth-child(2){min-width:0}
.plan-list{margin:0;padding:0;list-style:none;font-size:13.5px}
.plan-list li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.plan-list li:last-child{border-bottom:0}
.plan-list .s{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.25;color:var(--accent)}
.plan td,.plan th{text-align:left;white-space:normal;font-family:var(--body);vertical-align:top}
.plan td .sub{color:var(--ink-3);font-size:12px;font-family:var(--mono)}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.done-row label{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.done-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.nav{display:flex;gap:8px}
.summary-text{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:12px;margin:0}
.compare{overflow-x:auto}
.compare table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
.compare th,.compare td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.compare th{font-family:var(--data);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.compare th:first-child,.compare td:first-child{text-align:left;font-family:var(--body)}
.printer-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.printer-form .field{grid-template-columns:1fr}
.printer-form .field input{max-width:none;text-align:left}
.note{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.example-flag{font-size:12px;color:var(--warn);font-weight:500}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity var(--dur-base) var(--ease);pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.export{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px 20px;width:min(640px,calc(100vw - 32px))}
.export::backdrop{background:rgba(0,0,0,.55)}
.export h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.export p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}
.export textarea{width:100%;height:220px;font-family:var(--mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.export-actions{display:flex;gap:8px;margin-top:10px}
.helper{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 20px;font-size:13px;box-shadow:var(--shadow-sm)}
.helper .st{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.helper .st .dot{width:8px;height:8px}
.helper .grow{flex:1 1 auto}
.log{position:fixed;right:0;bottom:0;left:272px;background:var(--rail);border-top:1px solid var(--line);z-index:5;max-height:38vh;display:flex;flex-direction:column}
.log.min{max-height:none}
.log .bar{display:flex;align-items:center;gap:10px;padding:8px 16px;font-family:var(--data);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.log .bar .grow{flex:1}
.log ol{list-style:none;margin:0;padding:0 14px 10px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.log.min ol{display:none}
.log li{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.log li.ev-plugin{color:var(--ink)}
.log li.ev-data{color:var(--good)}
.log li.ev-warning{color:var(--warn)}
.log li.ev-error{color:var(--bad)}
.log li.ev-helper{color:var(--accent)}
.log li.ev-slicer{color:var(--ink-3)}
body.has-log main{padding-bottom:42vh}
@media (max-width:760px){.log{left:0}}
.warnbar{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--ink);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.warnbar + .warnbar{margin-top:-8px}
.gmap{overflow-x:auto;margin:0}
.gmap svg{display:block;min-width:900px}
.gmap text{font-family:var(--data);font-weight:500}
.gmap .wave{font-size:11px;letter-spacing:.12em;fill:var(--ink-3)}
.gmap .nd rect{fill:var(--sheet);stroke:var(--line);stroke-width:1.5}
.gmap .nd text{font-size:11.5px;fill:var(--ink-3)}
.gmap .nd.done rect{fill:var(--good-soft);stroke:var(--good)}
.gmap .nd.done text,.gmap .nd.ready text{fill:var(--ink)}
.gmap .nd.ready rect{stroke:var(--accent);stroke-width:2}
.gmap .nd .tg{font-size:9.5px;letter-spacing:.1em;fill:var(--ink-3)}
.gmap .ed{fill:none;stroke:var(--ink-3);stroke-width:1.4;opacity:.6}
.gmap .ah{fill:var(--ink-3);stroke:none;opacity:.6}
.gmap-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;font-size:13px}
.gmap-head select{padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:13px;max-width:100%}
.gmap-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin:12px 0 0}
.gmap-legend .sw{display:inline-block;width:16px;height:11px;border-radius:3px;border:1.5px solid var(--line);background:var(--sheet);margin-right:7px;vertical-align:-1px}
.gmap-legend .sw.done{background:var(--good-soft);border-color:var(--good)}
.gmap-legend .sw.ready{border-color:var(--accent);border-width:2px}
.gmap-legend .tg{font-family:var(--data);font-size:10px;letter-spacing:.1em;color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-right:7px}
.gmap-tbl table{min-width:680px}
.gmap-tbl th,.gmap-tbl td{text-align:left;white-space:normal;font-family:var(--body);vertical-align:top;width:26%}
.gmap-tbl th:first-child,.gmap-tbl td:first-child{width:22%;white-space:nowrap}
.gmap-tbl td:first-child{color:var(--ink-3)}
.rail-toggle{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .rail.collapsed .steps,.rail.collapsed .printer-list,.rail.collapsed .rail-actions,.rail.collapsed .eyebrow{display:none}
  .rail-toggle{display:inline-block}
  main{padding:20px 16px 48px}
  .sheet-head h1{font-size:34px}
  .field{grid-template-columns:1fr}
  .field .in{justify-content:flex-start}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">PETG <span class="model">Dial-In</span> Sheet<small>PrusaSlicer 3.0 · calibration suite</small> <button class="btn small rail-toggle" id="railToggle" type="button">Menu</button></div>
    <div>
      <p class="eyebrow">Printers</p>
      <div class="printer-list" id="printerList"></div>
      <div class="rail-actions" style="margin-top:8px"><button class="btn small" id="addPrinter" type="button">Add printer</button></div>
    </div>
    <div>
      <p class="eyebrow">Steps</p>
      <div class="steps" id="stepList"></div>
    </div>
    <div class="rail-actions">
      <button class="btn small" id="exportBtn" type="button">Export JSON</button>
      <label class="btn small" for="importFile" style="cursor:pointer">Import JSON</label>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn small danger" id="resetBtn" type="button">Clear all</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="export" id="pathsDialog" aria-labelledby="pathsTitle">
  <h2 id="pathsTitle">Paths</h2>
  <p>Point the helper at the PrusaSlicer you are calibrating with. Both are remembered.</p>
  <div class="fields">
    <div class="field wide"><label for="pathPrusa">PrusaSlicer folder or executable<small>the unpacked portable zip folder is fine, e.g. C:\Users\now\Downloads\PrusaSlicer-3.0.0-alpha11\PrusaSlicer-3.0.0-alpha11</small></label><input type="text" id="pathPrusa" spellcheck="false"></div>
    <div class="field wide"><label for="pathPlugins">Plugins folder<small>in that PrusaSlicer: Plugins › Show User Plugins Folder, then paste the path (its parent data folder also works)</small></label><input type="text" id="pathPlugins" spellcheck="false"></div>
  </div>
  <div class="export-actions"><button class="btn primary" id="pathsSave" type="button">Save paths</button><button class="btn" id="pathsClose" type="button">Cancel</button></div>
</dialog>
<dialog class="export" id="exportDialog" aria-labelledby="exportTitle">
  <h2 id="exportTitle">Export sheet</h2>
  <p>Copy this and save it as <code>petg-dialin-sheet.json</code>. Import it on another machine with Import JSON.</p>
  <textarea id="exportText" readonly spellcheck="false"></textarea>
  <div class="export-actions"><button class="btn primary" id="exportCopy" type="button">Copy JSON</button><button class="btn" id="exportClose" type="button">Close</button></div>
</dialog>

<script>
(function(){
"use strict";
const KEY = "petg-dialin-sheet-v1";

// ---------- state ----------
function examplePrinter(){
  return {
    id: "ex1", name: "Original Prusa MK4S 0.4 nozzle", tag: "MK4S 0.4", example: true,
    filament: "Prusament PETG Jet Black", density: 1.27, baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2,
    steps: {
      clean: { done_by: "gcode", notes: "grey PETG plug, a little black grit at the tip", done: true },
      temp: { chosen: 245, notes: "Gloss even from 250 down; 240 wing started to fray", done: true },
      flow: { method: "yolo", winner: -2, done: true },
      cooling:{ chosen: 40, done: true },
      pa:   { chosen: 0.045, done: true },
      vol:  { clean: 18, done: true },
      slab: { x: 60, y: 60, z: 20, posts: true, measured: 94.10, printed_em: 0.98, done: true },
      overlap:{ chosen: 15, done: true },
      bar:  { c0: 130, w0: 20, d0: 6, near: 123.55, far: 135.50, w: 20.09, d: 5.86, lift: 0.15, done: true },
      gauge:{ clearance: 0.2, h4: 3.86, h8: 7.90, h20: 19.93, peg8: 8.08, done: true },
      small:{ tips: false, slowdown: 25, minspeed: 10, notes: "3 mm pillar sagged above 30 mm", done: false },
      coupon:{ l: 49.97, w: 24.98, h: 10.02, hole: 9.94, foot: 0.15, overhang: "45° wing clean, slight droop at the tip", fins: "0.8 fin has gaps, 1.2 and 1.6 fine", done: false },
      string:{ temp: 245, fan: 30, done: false },
      apply:{ done: false }
    }
  };
}
function blankPrinter(name, tag){
  return { id: "p" + Date.now().toString(36), name, tag, example: false, filament: "Prusament PETG", density: 1.27,
    baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2, steps: {} };
}
let state = load();
function migrate(s){
  // flow used to store absolute pass1/pass2 percentages; it now stores a relative winner
  for (const p of s.printers || []) {
    const f = p.steps && p.steps.flow;
    if (f && f.winner === undefined && (f.pass1 != null || f.pass2 != null)) {
      const abs = f.pass2 ?? f.pass1; if (abs != null && abs !== "") f.winner = +abs - 100;
      f.method = f.method || "yolo"; delete f.pass1; delete f.pass2;
    }
  }
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.printers && s.printers.length) return migrate(s); } catch(e){}
  return { printers: [examplePrinter()], active: "ex1", step: "temp" };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function printer(){ return state.printers.find(p => p.id === state.active) || state.printers[0]; }
function sd(p, id){ p.steps[id] = p.steps[id] || {}; return p.steps[id]; }

// ---------- arithmetic ----------
const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const f = (v, d) => v === null || v === undefined || !isFinite(v) ? "—" : (+v).toFixed(d);
const rel = v => (v > 0 ? "+" : "") + f(v, 0);   // relative flow percentage, e.g. +5 / -4
function extrusionArea(w, h){ return (w - h) * h + Math.PI * (h / 2) ** 2; }
// Flow patches are entered relative to 100 (the +2 patch is +2). The one-pass methods choose
// 100 + winner; the two-pass method multiplies the two corrections, the second being 0 or negative.
function flowMethod(p){ const m = sd(p,"flow").method; return m === "twopass" ? "twopass" : "yolo"; }
function flowWinner(p){ return num(sd(p,"flow").winner); }
function flowWinner2(p){ return num(sd(p,"flow").winner2); }
function flowChosen(p){
  const w = flowWinner(p); if (w === null) return null;
  let pct = 100 + w;
  if (flowMethod(p) === "twopass") { const w2 = flowWinner2(p); if (w2 !== null) pct = pct * (100 + w2) / 100; }
  return pct;
}
function multiplierAfterFlow(p){ const c = flowChosen(p); return c !== null ? p.baseMultiplier * c / 100 : p.baseMultiplier; }
function slabNominal(p){
  const s = sd(p,"slab"); const x = num(s.x) ?? 60, y = num(s.y) ?? 60, z = num(s.z) ?? 20;
  let mm3 = x * y * z; if (s.posts !== false) mm3 += 4 * 6 * 6 * 12;
  return { cm3: mm3 / 1000, g: mm3 / 1000 * (num(p.density) ?? 1.27) };
}
function slabBaseMultiplier(p){ return num(sd(p,"slab").printed_em) ?? multiplierAfterFlow(p); }
function multiplierAfterSlab(p){
  const m = num(sd(p,"slab").measured); const n = slabNominal(p);
  return m ? slabBaseMultiplier(p) * n.g / m : null;
}
function finalMultiplier(p){ return multiplierAfterSlab(p) ?? (flowChosen(p) ? multiplierAfterFlow(p) : null); }
function barResult(p){
  const b = sd(p,"bar"); const c0 = num(b.c0) ?? 130, w0 = num(b.w0) ?? 20, d0 = num(b.d0) ?? 6;
  const near = num(b.near), far = num(b.far), w = num(b.w), d = num(b.d);
  const c = (near !== null && far !== null) ? (near + far) / 2 : null;
  const s = c !== null ? 1 - c / c0 : null;
  const gW = (w !== null && s !== null) ? (w - w0 * (1 - s)) / 2 : (w !== null ? (w - w0) / 2 : null);
  const gD = (d !== null && s !== null) ? (d0 * (1 - s) - d) / 2 : (d !== null ? (d0 - d) / 2 : null);
  const g = gW !== null && gD !== null ? (gW + gD) / 2 : (gW ?? gD);
  return { c, s, gW, gD, g, scale: s !== null ? 1 / (1 - s) : null };
}
function volLimit(p){ const c = num(sd(p,"vol").clean); return c ? c * 0.85 : null; }

// Gates: the steps whose results are inputs to this one. Advice only — a blocked step can still
// be edited and run. The order follows OrcaSlicer's: temperature, volumetric, PA, flow, then mass.
const GATES = {
  clean:[], temp:["clean"], vol:["temp"], pa:["vol"], flow:["pa"], slab:["flow"], cooling:["slab"],
  overlap:["slab"], bar:["slab"], gauge:["slab"], small:["cooling"], coupon:["slab","cooling"],
  string:["flow"], apply:["temp"]
};
function stepDone(p, id){ return !!(p.steps[id] && p.steps[id].done); }
function blockedBy(p, id){ return (GATES[id] || []).filter(g => !stepDone(p, g)).map(g => STEPS.find(s => s.id === g)).filter(Boolean); }
function isReady(p, id){ return blockedBy(p, id).length === 0; }
function blockedText(p, id){
  const b = blockedBy(p, id); if (!b.length) return "";
  return "Blocked: finish " + b.map(s => "step " + s.n + " " + s.name).join(", ") + " first. Their results are inputs to this test.";
}

// Steps that must be printed with an earlier result already applied.
// Returns warning strings from the last DATA line's preset snapshot.
function consistencyWarnings(p){
  const w = [];
  if (p.baselineWarning) w.push(p.baselineWarning);
  const snap = p.lastSnapshot; if (!snap) return w;
  const order = STEPS.map(s => s.id); const at = order.indexOf(snap.step);
  const atN = STEPS[at] ? STEPS[at].n : at;
  const t = num(sd(p,"temp").chosen);
  if (t && at > order.indexOf("temp") && snap.p_temperature && snap.p_temperature !== t)
    w.push(`Step ${atN} was printed at ${snap.p_temperature} °C but step ${stepNumber("temp")} chose ${t} °C. Apply the temperature first (step ${stepNumber("apply")} or Tools › Apply values from profile.lua).`);
  const pa = num(sd(p,"pa").chosen);
  if (pa !== null && at > order.indexOf("pa") && snap.p_pressure_advance != null && Math.abs(snap.p_pressure_advance - pa) > 0.0005)
    w.push(`Step ${atN} was printed with pressure advance ${f(snap.p_pressure_advance,3)} in the preset but step ${stepNumber("pa")} chose ${f(pa,3)}. Apply it first (or the preset's PA mode is disabled and start G-code sets it).`);
  const m = multiplierAfterFlow(p);
  const target = multiplierAfterSlab(p) ?? m;
  if (flowChosen(p) && at > order.indexOf("flow") && snap.p_extrusion_multiplier && Math.abs(snap.p_extrusion_multiplier - target) > 0.0015 && Math.abs(snap.p_extrusion_multiplier - m) > 0.0015)
    w.push(`Step ${atN} was printed with extrusion multiplier ${f(snap.p_extrusion_multiplier,4)} but the dialed-in value is ${f(target,4)}. Apply it first.`);
  return w;
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function stepNumber(id){ const s = STEPS.find(x => x.id === id); return s ? s.n : "?"; }
function stepStatus(p, st){
  const d = p.steps[st.id]; if (!d) return "";
  if (d.done) return "done";
  return Object.keys(d).some(k => k !== "done" && d[k] !== "" && d[k] !== null && d[k] !== undefined) ? "partial" : "";
}
function renderRail(){

  });

}
function fieldHtml(st, d, fl){

  else input = `<input type="number" id="${id}" data-field="${fl.k}" value="${esc(v)}" step="${fl.step||1}" inputmode="decimal" placeholder="${esc(fl.ph||"")}">`;
  return `<div class="field ${fl.wide?"wide":""}"><label for="${id}">${esc(fl.label)}</label><div class="in">${input}${fl.unit?`<span class="unit">${fl.unit}</span>`:""}</div></div>`;
}

function renderStep(st){

    <div class="done-row"><label><input type="checkbox" id="doneBox" ${d.done?"checked":""}> Step ${st.n} done for ${esc(p.tag)}</label><div class="nav">${prev?`<button class="btn" type="button" data-go="${prev.id}">← ${prev.n}</button>`:""}${next?`<button class="btn primary" type="button" data-go="${next.id}">Next: ${next.n}. ${esc(next.name)} →</button>`:`<button class="btn primary" type="button" data-go="compare">Compare printers →</button>`}</div></div>`;
  $("#main").querySelectorAll("[data-field]").forEach(el => el.addEventListener("input", () => {

function refreshRun(st){ const t = $("#main .vals"); if (t) t.innerHTML = st.run(printer()).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join(""); }
function summaryText(p){
  const t = num(sd(p,"temp").chosen), m = finalMultiplier(p), v = volLimit(p), o = num(sd(p,"overlap").chosen), r = barResult(p), foot = num(sd(p,"coupon").foot);

    `  slowdown / min speed   ${num(sd(p,"small").slowdown)!==null?f(sd(p,"small").slowdown,0)+" s":"keep"} / ${num(sd(p,"small").minspeed)!==null?f(sd(p,"small").minspeed,0)+" mm/s":"keep"}`,

// The graph is drawn from GATES and STEPS, so it cannot disagree with the gates.
let planGraphPrinter = null;
function planPrinter(){

function gateWaves(){
  const w = {};

    if (w[id] !== undefined) return w[id];
    w[id] = 0;                                   // guard, and the value for a gateless step
    const g = (GATES[id] || []).filter(x => STEPS.some(s => s.id === x));
    if (g.length) w[id] = 1 + Math.max.apply(null, g.map(calc));
    return w[id];
  };

}
function gateColumns(){

}
function gmWrap(text, max){

function gateMapSvg(p){
  const cols = gateColumns();

  const pitchX = NW + CG, pitchY = NH + RG;
  const top = PAD + 22;
  let maxRows = 1; for (const c of cols) if (c.length > maxRows) maxRows = c.length;
  const band = maxRows * pitchY - RG, pos = {};
  cols.forEach((c, ci) => { const y0 = top + (band - (c.length * pitchY - RG)) / 2;
    c.forEach((st, ri) => { pos[st.id] = { x: PAD + ci * pitchX, y: y0 + ri * pitchY, col: ci }; }); });
  const bottom = top + band;
  const edges = [];
  for (const st of STEPS) for (const g of (GATES[st.id] || [])) if (pos[g] && pos[st.id]) edges.push([g, st.id]);
  const lanes = edges.filter(([g,s]) => pos[s].col - pos[g].col > 1).length;
  const W = PAD * 2 + cols.length * pitchX - CG;
  const H = bottom + 14 + lanes * 16 + PAD;
  const out = [];
  cols.forEach((c, ci) => out.push(`<text class="wave" x="${PAD + ci*pitchX + NW/2}" y="${PAD + 8}" text-anchor="middle">WAVE ${ci+1}</text>`));

    const a = pos[g], b = pos[id];
    if (b.col - a.col > 1) {                     // long hop: routed in its own lane under the graph

      out.push(`<path class="ed" d="M${ax} ${a.y+NH} V${ly} H${bx} V${b.y+NH+8}"></path>`);
      out.push(`<polygon class="ah" points="${bx},${b.y+NH} ${bx-4},${b.y+NH+8} ${bx+4},${b.y+NH+8}"></polygon>`);
    } else {
      const x1 = a.x + NW, y1 = a.y + NH/2, x2 = b.x - 8, y2 = b.y + NH/2;
      out.push(`<path class="ed" d="M${x1} ${y1} C${x1+28} ${y1}, ${x2-28} ${y2}, ${x2} ${y2}"></path>`);
      out.push(`<polygon class="ah" points="${b.x},${y2} ${x2},${y2-4} ${x2},${y2+4}"></polygon>`);
    }

    const q = pos[st.id], done = stepDone(p, st.id);

    const lines = gmWrap(st.n + ". " + st.name, 19), cx = q.x + NW/2;

    out.push(`<g class="nd ${cls}"><rect x="${q.x}" y="${q.y}" width="${NW}" height="${NH}" rx="8"></rect>`

      + (st.share === "model" ? `<text class="tg" x="${cx}" y="${q.y+NH-9}" text-anchor="middle">SHARED</text>` : "")
      + `</g>`);
  }

}

function luaStr(v){ return '"' + String(v).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g," ") + '"'; }
function profileEntry(p){

  const e = [["tag", luaStr(p.tag)]];
  if (p.layer) e.push(["layer_height", f(p.layer,3)]);
  if (p.nozzle) e.push(["nozzle", f(p.nozzle,2)]);
  if (t) { e.push(["temperature", f(t,0)]); e.push(["first_layer_temperature", f(t-10,0)]); }
  if (m) e.push(["extrusion_multiplier", f(m,4)]);
  if (v) e.push(["filament_max_volumetric_speed", f(v,1)]);
  if (num(sd(p,"pa").chosen)!==null) e.push(["pressure_advance", f(sd(p,"pa").chosen,3)]);
  const cf = num(sd(p,"cooling").chosen); if (cf !== null) { e.push(["min_fan_speed", f(cf,0)]); e.push(["max_fan_speed", f(num(sd(p,"cooling").max)??Math.min(100,cf+20),0)]); }

  if (num(sd(p,"small").minspeed)!==null) e.push(["min_print_speed", f(sd(p,"small").minspeed,0)]);
  if (o) e.push(["infill_overlap", luaStr(f(o,0)+"%")]);
  if (r.g !== null) e.push(["xy_size_compensation", f(-r.g,3)]);
  if (foot !== null) e.push(["elefant_foot_compensation", f(foot,2)]);

}
function profileLua(){
  const lines = ["-- profile.lua: written by the PETG Dial-In Sheet on " + new Date().toISOString().slice(0,16).replace("T"," ") + ".",
    "-- Keyed by printer name as PrusaSlicer shows it. Read by every command for the tag,",
    "-- and by Tools > Apply values from profile.lua for the preset values.", "return {"];
  for (const p of state.printers) {
    if (p.example) continue;
    lines.push("  [" + luaStr(p.name) + "] = {");
    for (const [k, v] of profileEntry(p)) lines.push("    " + k + " = " + v + ",");
    lines.push("  },");

}

function onData(d){

  else if (p.example) { p.steps = {}; p.example = false; if (d.tag) p.tag = d.tag; toast("Replaced the example's numbers with your " + d.printer); }
  else if (!p.tag && d.tag) p.tag = d.tag;

  const go = e.target.closest("[data-go]"); if (go) { state.step = go.dataset.go; render(); window.scrollTo({top:0}); return; }
  const hb = e.target.closest("[data-helper]"); if (hb) { helperAction(hb.dataset.helper); return; }
  const pc = e.target.closest("#profileCopy"); if (pc) { const t = $("#profileText"); navigator.clipboard && navigator.clipboard.writeText(t.value).then(()=>toast("Copied profile.lua")); return; }
});
$("#addPrinter").addEventListener("click", () => {
  const name = prompt("Printer name as PrusaSlicer shows it", "Original Prusa MK4S 0.4 nozzle"); if (!name) return;
  const tag = prompt("Short tag to engrave on parts", "MK4S #" + (state.printers.length + 1)) || name.slice(0, 12);
  const p = blankPrinter(name.trim(), tag.trim()); state.printers.push(p); state.active = p.id; state.step = "printer"; render();
});
$("#exportBtn").addEventListener("click", () => {
  const json = JSON.stringify(state, null, 2);
  const dlg = $("#exportDialog"); $("#exportText").value = json;
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
});
$("#exportCopy").addEventListener("click", () => {
  const ta = $("#exportText"); ta.select();
  const done = () => toast("Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
});
$("#exportClose").addEventListener("click", () => { const dlg = $("#exportDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
$("#pathsClose").addEventListener("click", () => { const dlg = $("#pathsDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
$("#pathsSave").addEventListener("click", async () => {
  try { await api("/api/config", { prusaslicer: $("#pathPrusa").value.trim(), plugins_dir: $("#pathPlugins").value.trim() }); toast("Paths saved"); const dlg = $("#pathsDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); render(); }
  catch (e) { toast(e.message); }
});
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => { const s = JSON.parse(t); if (!s.printers) throw new Error("no printers"); state = migrate(s); state.step = state.step || "temp"; save(); render(); toast("Imported"); }).catch(() => toast("That file is not a dial-in sheet export"));
  e.target.value = "";
});
$("#resetBtn").addEventListener("click", () => { if (confirm("Clear every printer and measurement in this browser?")) { state = { printers:[examplePrinter()], active:"ex1", step:"temp" }; save(); render(); } });
$("#railToggle").addEventListener("click", () => $("#rail").classList.toggle("collapsed"));
if (window.matchMedia("(max-width:760px)").matches) $("#rail").classList.add("collapsed");

render();
detectHelper();
})();
</script>
</body>
</html>
