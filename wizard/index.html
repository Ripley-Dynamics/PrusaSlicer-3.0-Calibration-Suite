<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PETG Dial-In Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Prusa Design System tokens (Brand Manual v1.0; EIT surface). Light first, dark below. */
:root{
  --paper:#F7F7F7; --sheet:#FFFFFF; --rail:#F0F0F0; --line:#E5E5E5; --line-soft:#F0F0F0;
  --ink:#111111; --ink-2:#333333; --ink-3:#666666;
  --accent:#FD5000; --accent-hover:#E04500; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.10);
  --good:#008555; --good-soft:rgba(0,196,141,.10); --warn:#7A6800; --warn-soft:rgba(255,220,0,.18); --bad:#A00000; --bad-soft:rgba(237,0,0,.10);
  --focus:#346EF4; --shadow-sm:0 1px 2px rgba(0,0,0,.08); --shadow-lg:0 12px 32px rgba(0,0,0,.18);
  --display:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --data:"Inter Tight","Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --dur-fast:120ms; --dur-base:180ms; --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121212; --sheet:#1E1E1E; --rail:#1A1A1A; --line:#2E2E2E; --line-soft:#262626;
    --ink:#FFFFFF; --ink-2:#E0E0E0; --ink-3:#B0B0B0;
    --accent:#FD5000; --accent-hover:#FD8333; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.18);
    --good:#00C48D; --good-soft:rgba(0,196,141,.18); --warn:#FFE044; --warn-soft:rgba(255,220,0,.18); --bad:#FF4444; --bad-soft:rgba(237,0,0,.18);
    --focus:#5C8CF8; --shadow-sm:none; --shadow-lg:0 18px 40px rgba(0,0,0,.70);
  }
}
:root[data-theme="dark"]{
  --paper:#121212; --sheet:#1E1E1E; --rail:#1A1A1A; --line:#2E2E2E; --line-soft:#262626;
  --ink:#FFFFFF; --ink-2:#E0E0E0; --ink-3:#B0B0B0;
  --accent:#FD5000; --accent-hover:#FD8333; --accent-ink:#FFFFFF; --accent-soft:rgba(253,80,0,.18);
  --good:#00C48D; --good-soft:rgba(0,196,141,.18); --warn:#FFE044; --warn-soft:rgba(255,220,0,.18); --bad:#FF4444; --bad-soft:rgba(237,0,0,.18);
  --focus:#5C8CF8; --shadow-sm:none; --shadow-lg:0 18px 40px rgba(0,0,0,.70);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
/* ---- shell: 56px top bar, 232px rail, main ---- */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{height:56px;flex:none;background:var(--sheet);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 20px}
.wordmark{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.01em;text-transform:uppercase;line-height:1;white-space:nowrap}
.wordmark .a{color:var(--accent)}
.topbar-mid{flex:none;min-width:0}
/* the helper cluster is the only thing in the right slot; its popover must escape the bar */
.topbar-right{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:12px;overflow:visible}
.select-wrap{position:relative;display:inline-flex;align-items:center}
.select-wrap>svg{position:absolute;right:10px;pointer-events:none;color:var(--ink-3)}
.dialin-select{height:32px;max-width:340px;padding:0 32px 0 12px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--ink);appearance:none;-webkit-appearance:none;cursor:pointer;text-overflow:ellipsis}
.body{flex:1;min-height:0;display:flex}
main{flex:1;min-width:0;padding:40px 48px 64px}
main>*{max-width:960px}
/* ---- rail ---- */
.rail{width:232px;flex:none;background:var(--rail);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--data);font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;line-height:1}
.rail .eyebrow,.card .eyebrow,.dcard .eyebrow,.fsec .eyebrow{margin:0}
.rlist{display:flex;flex-direction:column;gap:2px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink-2)}
.rrow:hover{background:var(--sheet)}
.rrow[aria-current="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink);font-weight:500}
.rrow .n{flex:none;width:20px;font-family:var(--display);font-weight:600;font-size:18px;line-height:1;color:var(--ink-3)}
.rrow[aria-current="true"] .n{color:var(--accent)}
.rrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.tall{height:56px}
.rrow .two{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rrow .two b{font-weight:400;font-size:14px;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .two span{font-family:var(--mono);font-size:12px;line-height:1.2;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.new{background:var(--sheet);border-color:var(--line);color:var(--ink);font-weight:500}
.rrow.new svg{color:var(--accent);flex:none}
.rrow.quiet{height:32px;color:var(--ink-3)}
.rrow.quiet[aria-current="true"]{color:var(--ink)}
.rrow.strong{color:var(--ink);font-weight:500}
.rrow.strong svg{color:var(--ink-3);flex:none}
.rrow .ok{color:var(--good);flex:none;display:flex}
.rsep{height:1px;flex:none;background:var(--line)}
.sdot{flex:none;width:9px;height:9px;border-radius:50%;box-sizing:border-box}
.sdot.done{background:var(--good)}
.sdot.partial{background:var(--warn)}
.sdot.ready{border:1.5px solid var(--accent)}
.sdot.blocked{border:1.5px solid var(--line)}
/* ---- buttons ---- */
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease)}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.lg{height:44px;padding:0 18px;border-radius:8px;font-size:14px}
.btn svg{flex:none}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--accent);cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.linkbtn.quiet{color:var(--ink-3)}
/* ---- step screen ---- */
.step-head{display:flex;flex-direction:column;gap:12px}
.step-head .t{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.step-head .num{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.step-head h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.step-head .who{margin-left:auto;align-self:center;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:right}
.lede{font-size:15px;line-height:1.55;color:var(--ink-2);max-width:60ch;margin:0}
.gateline{font-size:13px;color:var(--ink-3);margin:0}
.warns{margin-top:40px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start;margin-top:40px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.two .card:nth-child(3){grid-column:1 / -1}
.warns+.cards{margin-top:24px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:16px;min-width:0}
.runrows{display:flex;flex-direction:column}
.runrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:4px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-2)}
.runrow:last-child{border-bottom:0}
.runrow b{font-family:var(--mono);font-weight:400;font-size:13px;color:var(--ink);text-align:right}
.disc{border-top:1px solid var(--line-soft);padding-top:12px}
.disc>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;font-size:13px;color:var(--ink-3)}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary svg{color:var(--ink-3);transition:transform var(--dur-fast) var(--ease)}
.disc[open]>summary svg{transform:rotate(90deg)}
.disc ul{margin:16px 0 0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.disc li+li{margin-top:8px}
.results{display:flex;flex-direction:column;gap:16px}
.resrow{display:flex;flex-direction:column;gap:4px}
.resrow.first{padding-bottom:16px;border-bottom:1px solid var(--line-soft)}
.res{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.res .l{font-size:13px;color:var(--ink-2)}
.res .v{font-family:var(--mono);font-weight:500;font-size:18px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.resrow.first .v{font-size:28px;line-height:1;color:var(--accent)}
.res .v.muted{color:var(--ink-3);font-size:14px}
.resrow .sub{font-size:12px;color:var(--ink-3);text-align:right}
.botrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px}
.botrow .nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.donetoggle{position:relative;height:44px;display:inline-flex;align-items:center;gap:10px;padding:0 16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink)}
.donetoggle input{position:absolute;opacity:0;width:0;height:0}
.donetoggle .box{flex:none;width:20px;height:20px;border-radius:4px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent}
.donetoggle input:checked+.box{background:var(--good);border-color:var(--good);color:var(--accent-ink)}
.donetoggle:focus-within{outline:2px solid var(--focus);outline-offset:2px}
/* ---- welcome ---- */
.welcome{display:flex;flex-direction:column;gap:40px}
.hero{display:flex;flex-direction:column;gap:24px;align-items:flex-start}
.hero h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;margin:0}
.hero p{font-size:15px;line-height:1.55;color:var(--ink-2);max-width:60ch;margin:0}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;align-items:start}
.dcard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}
.dcard .ttl{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;color:var(--ink)}
.pbar{width:100%;display:flex;align-items:center;gap:12px}
.pbar .track{flex:1;height:6px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.pbar .fill{height:100%;background:var(--good);border-radius:999px}
.pbar .cnt{flex:none;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.statusrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;font-size:13px;color:var(--ink-3)}
.statusrow .st{display:flex;align-items:center;gap:8px}
.statusrow .d{flex:none;width:8px;height:8px;border-radius:50%;background:var(--line)}
.statusrow .d.on{background:var(--good)}
.quietlinks{display:flex;flex-wrap:wrap;gap:20px}
.statusrow+.quietlinks{margin-top:-24px}
/* ---- new dial-in form ---- */
.form{display:flex;flex-direction:column;gap:32px;max-width:760px}
.form h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1.05;letter-spacing:-.01em;text-transform:uppercase;margin:0}
.fsec{display:flex;flex-direction:column;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);text-align:left;cursor:pointer}
.tile:hover{border-color:var(--ink-3)}
.tile[aria-pressed="true"]{border:2px solid var(--accent);padding:0 15px;color:var(--accent)}
.tile span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.inline{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:14px;color:var(--ink-2)}
.inline input,.inline select{height:36px;padding:0 12px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;font-size:14px;color:var(--ink)}
.inline .mono{font-family:var(--mono);font-size:13px}
.inline .select-wrap .dialin-select{height:36px;min-width:112px;background:var(--sheet)}
.inline .grow{flex:1 1 240px;max-width:360px;min-width:0}
.inline .pair{display:inline-flex;align-items:center;gap:12px;min-width:0;margin-left:12px}
.inline .pair input{width:180px;max-width:100%}
.names{border-top:1px solid var(--line);padding-top:16px}
.names>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.names>summary::-webkit-details-marker{display:none}
.names>summary svg{transition:transform var(--dur-fast) var(--ease)}
.names[open]>summary svg{transform:rotate(90deg)}
.names .fields{margin-top:16px;max-width:420px}
.formrow{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.formrow .left{margin-right:auto;display:flex;gap:16px;flex-wrap:wrap}
/* ---- kept for Print plan, Compare, dialogs and the helper bar ---- */
.cards.one{grid-template-columns:minmax(0,1fr)}
.card>.note{margin:0}
.cmd{font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;margin:0;word-break:break-word;color:var(--ink-2)}
.fields{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:13px;color:var(--ink-2)}
.field label small{display:block;color:var(--ink-3);font-size:12px}
.field .in{display:flex;align-items:center;gap:8px}
.field input,.field select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;min-width:0}
.field input[type=number]{width:120px;font-family:var(--mono);text-align:right}
.field input[type=text],.field select{width:100%}
.field .unit{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.pill{display:inline-block;font-family:var(--data);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.plan-list{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 32px;font-size:13.5px}
.plan-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:center;min-height:24px;color:var(--ink-2)}
.plan-list .s{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--data);font-size:11px;font-weight:600;letter-spacing:.06em}
.compare.plan table{min-width:520px}
.compare.plan th,.compare.plan td{text-align:left;white-space:normal;font-family:var(--body);vertical-align:middle;color:var(--ink-2);height:auto;padding:12px 24px 12px 0;line-height:1.5}
.compare.plan th:last-child,.compare.plan td:last-child{padding-right:0}
.compare.plan td:first-child{white-space:nowrap;width:1%}
.compare.plan .nm{display:block;font-size:13px;font-weight:500;color:var(--ink)}
.compare.plan .tg{display:block;margin-top:2px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.summary-text{font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:12px;margin:0}
.compare{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;max-width:100%;margin:0}
.compare table{border-collapse:collapse;font-size:13px;min-width:420px;width:100%}
.compare th,.compare td{height:36px;padding:0 24px 0 0;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink)}
.compare th:last-child,.compare td:last-child{padding-right:0}
.compare tbody tr:last-child th,.compare tbody tr:last-child td{border-bottom:0}
.compare thead th{height:auto;padding-bottom:12px;vertical-align:bottom;font-family:var(--data);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.compare .lbl,.compare th:first-child,.compare td:first-child{text-align:left;font-family:var(--body);font-weight:400;color:var(--ink-2)}
.compare .nm{display:block;font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.compare .tg{display:block;margin-top:2px;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.compare .na{color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity var(--dur-base) var(--ease);pointer-events:none;box-shadow:var(--shadow-lg);z-index:60}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* ---- dialogs (Paths, Save preset / Export JSON) ---- */
.export{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:24px;width:min(640px,calc(100vw - 32px));box-shadow:var(--shadow-lg)}
.export::backdrop{background:rgba(0,0,0,.45)}
.export h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1;margin:0 0 8px}
.export p{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--ink-3)}
.export .fields{gap:18px;margin:0 0 4px}
.export .presetline{font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--ink-2);margin:-4px 0 16px;word-break:break-word}
.export-actions .btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.export textarea{width:100%;height:240px;font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.export-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
/* ---- helper cluster + popover ---- */
.hcluster{position:relative;display:flex;align-items:center;gap:8px;min-width:0}
.hchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 4px;background:none;border:0;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;cursor:pointer}
.hchip:hover{color:var(--ink)}
.hchip.off{cursor:default;color:var(--ink-3)}
.hdot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.hdot.ok{background:var(--good)}
.hdot.warn{background:var(--warn)}
.hbtn{height:32px;padding:0 12px;font-size:13px;white-space:nowrap;flex:none}

.log .bar .grow{flex:1}
.log .bar .btn{height:28px;padding:0 10px;font-size:12px}

@media (max-width:760px){.log{left:0}}

.gmap .nd .tg{font-size:9.5px;letter-spacing:.1em;fill:var(--ink-3)}
.gmap .ed{fill:none;stroke:var(--ink-3);stroke-width:1.4;opacity:.6}
.gmap .ah{fill:var(--ink-3);stroke:none;opacity:.6}

  </div>
</div>

<div class="toast" id="toast" role="status"></div>

    <div class="field"><label for="pathPlugins">Plugins folder<small>In that PrusaSlicer: Plugins › Show User Plugins Folder.</small></label><input type="text" id="pathPlugins" spellcheck="false"></div>
  </div>

</dialog>

  <div class="fields" id="exportBaseWrap" hidden><div class="field"><label for="exportBase">Based on the PrusaSlicer system filament preset<small>Its exact name in PrusaSlicer, e.g. Prusament PETG. Everything you did not dial in is inherited from it, as PrusaSlicer evaluates it for this printer and nozzle.</small></label><input type="text" id="exportBase" spellcheck="false"></div></div>
  <textarea id="exportText" readonly spellcheck="false"></textarea>
  <div class="export-actions"><button class="btn" id="exportClose" type="button">Close</button><button class="btn" id="exportCopy" type="button">Copy JSON</button><button class="btn" id="exportDownload" type="button" hidden>Download .yaml</button><button class="btn primary" id="exportWrite" type="button" hidden>Write to PrusaSlicer</button></div>
</dialog>

<script>
(function(){
"use strict";
const KEY = "petg-dialin-sheet-v1";

// ---------- state ----------
function examplePrinter(){
  return {
    id: "ex1", name: "Original Prusa MK4S 0.4 nozzle", tag: "MK4S 0.4", example: true, model: "MK4S", spool: "",
    filament: "Prusament PETG Jet Black", presetName: "Prusament PETG Jet Black · MK4S 0.4 dialed",
    density: 1.27, baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2,
    steps: {
      clean: { done_by: "gcode", notes: "grey PETG plug, a little black grit at the tip", done: true },
      temp: { chosen: 245, notes: "Gloss even from 250 down; 240 wing started to fray", done: true },
      flow: { method: "yolo", winner: -2, done: true },
      cooling:{ chosen: 40, done: true },
      pa:   { chosen: 0.045, done: true },
      vol:  { clean: 18, done: true },
      slab: { x: 60, y: 60, z: 20, posts: true, measured: 94.10, printed_em: 0.98, done: true },
      overlap:{ chosen: 15, done: true },
      bar:  { c0: 130, w0: 20, d0: 6, near: 123.55, far: 135.50, w: 20.09, d: 5.86, lift: 0.15, done: true },
      gauge:{ clearance: 0.2, h4: 3.86, h8: 7.90, h20: 19.93, peg8: 8.08, done: true },
      small:{ tips: false, slowdown: 25, minspeed: 10, notes: "3 mm pillar sagged above 30 mm", done: false },
      coupon:{ l: 49.97, w: 24.98, h: 10.02, hole: 9.94, foot: 0.15, overhang: "45° wing clean, slight droop at the tip", fins: "0.8 fin has gaps, 1.2 and 1.6 fine", done: false },
      string:{ temp: 245, fan: 30, done: false },
      apply:{ done: false }
    }
  };
}
function blankPrinter(name, tag){
  return { id: "p" + Date.now().toString(36), name, tag, example: false, model: modelFromName(name),
    filament: "Prusament PETG", presetName: presetDefault("Prusament PETG", tag), spool: "",
    density: 1.27, baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2, steps: {} };
}
// A dial-in is one printer + one material. `filament` is the material; `model` and the
// PrusaSlicer preset name are derived from it and the nozzle.
const MODELS = ["MK4S","MK4","CORE One","CORE One L","XL","MINI+","MK3S+","Other"];
const PS_NAME = { "MK4S":"Original Prusa MK4S", "MK4":"Original Prusa MK4", "CORE One":"Original Prusa CORE One",
  "CORE One L":"Original Prusa CORE One L", "XL":"Original Prusa XL", "MINI+":"Original Prusa MINI & MINI+", "MK3S+":"Original Prusa MK3S & MK3S+" };
const MATERIALS = [["Prusament PETG",1.27],["Prusament PLA",1.24],["Prusament ASA",1.07],["Prusament PC Blend",1.22],["Prusament PA11 CF",1.10]];
const NOZZLES = [0.25,0.4,0.5,0.6,0.8];
function modelFromName(name){
  const s = String(name || "");
  if (/mk4\s*s/i.test(s)) return "MK4S";
  if (/mk4/i.test(s)) return "MK4";
  if (/core\s*one\s*l(?![a-z])/i.test(s)) return "CORE One L";
  if (/core\s*one/i.test(s)) return "CORE One";
  if (/(^|[^a-z])xl([^a-z]|$)/i.test(s)) return "XL";
  if (/mini/i.test(s)) return "MINI+";
  if (/mk3\s*s/i.test(s)) return "MK3S+";
  return "Other";
}
function psName(model, nozzle){ const b = PS_NAME[model]; return b ? b + " " + (+nozzle || 0.4) + " nozzle" : ""; }
function materialDensity(m){ const e = MATERIALS.find(x => x[0] === m); return e ? e[1] : 1.27; }
function presetDefault(material, tag){ const m = String(material || ""), t = String(tag || "").trim();
  return t ? m + " · " + t + " dialed" : m + " dialed"; }
let state = load();
function migrate(s){
  // flow used to store absolute pass1/pass2 percentages; it now stores a relative winner
  for (const p of s.printers || []) {
    const f = p.steps && p.steps.flow;
    if (f && f.winner === undefined && (f.pass1 != null || f.pass2 != null)) {
      // each pass was an absolute M221 percentage; both are kept, as pass 2 is relative to pass 1
      if (f.pass1 != null && f.pass1 !== "") f.winner = +f.pass1 - 100;
      if (f.pass2 != null && f.pass2 !== "") f.winner2 = +f.pass2 - 100;
      f.method = (f.pass2 != null && f.pass2 !== "") ? "twopass" : (f.method || "yolo");
      delete f.pass1; delete f.pass2;
    }
    // a printer row is now a dial-in: printer model, material, preset name, spool
    if (!p.model) p.model = modelFromName(p.name);
    if (!p.filament) p.filament = "Prusament PETG";
    if (!p.presetName) p.presetName = presetDefault(p.filament, p.tag);
    if (p.spool === undefined) p.spool = "";
    if (!p.steps) p.steps = {};
  }
  if (s.step === "printer") s.step = "edit";              // the old printer form is now Edit
  if (!s.step) s.step = "welcome";
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.printers && s.printers.length) return migrate(s); } catch(e){}
  return { printers: [examplePrinter()], active: "ex1", step: "welcome" };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function printer(){ return state.printers.find(p => p.id === state.active) || state.printers[0]; }
function sd(p, id){ p.steps[id] = p.steps[id] || {}; return p.steps[id]; }

// ---------- arithmetic ----------
const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const f = (v, d) => v === null || v === undefined || !isFinite(v) ? "—" : (+v).toFixed(d);
const rel = v => (v > 0 ? "+" : "") + f(v, 0);   // relative flow percentage, e.g. +5 / -4
function extrusionArea(w, h){ return (w - h) * h + Math.PI * (h / 2) ** 2; }
// Flow patches are entered relative to 100 (the +2 patch is +2). The one-pass methods choose
// 100 + winner; the two-pass method multiplies the two corrections, the second being 0 or negative.
function flowMethod(p){ const m = sd(p,"flow").method; return m === "twopass" ? "twopass" : "yolo"; }
function flowWinner(p){ return num(sd(p,"flow").winner); }
function flowWinner2(p){ return num(sd(p,"flow").winner2); }
function flowChosen(p){
  const w = flowWinner(p); if (w === null) return null;
  let pct = 100 + w;
  if (flowMethod(p) === "twopass") { const w2 = flowWinner2(p); if (w2 !== null) pct = pct * (100 + w2) / 100; }
  return pct;
}
function multiplierAfterFlow(p){ const c = flowChosen(p); return c !== null ? p.baseMultiplier * c / 100 : p.baseMultiplier; }
function slabNominal(p){
  const s = sd(p,"slab"); const x = num(s.x) ?? 60, y = num(s.y) ?? 60, z = num(s.z) ?? 20;
  let mm3 = x * y * z; if (s.posts !== false) mm3 += 4 * 6 * 6 * 12;
  return { cm3: mm3 / 1000, g: mm3 / 1000 * (num(p.density) ?? 1.27) };
}
function slabBaseMultiplier(p){ return num(sd(p,"slab").printed_em) ?? multiplierAfterFlow(p); }
function multiplierAfterSlab(p){
  const m = num(sd(p,"slab").measured); const n = slabNominal(p);
  return m ? slabBaseMultiplier(p) * n.g / m : null;
}
function finalMultiplier(p){ return multiplierAfterSlab(p) ?? (flowChosen(p) ? multiplierAfterFlow(p) : null); }
function barResult(p){
  const b = sd(p,"bar"); const c0 = num(b.c0) ?? 130, w0 = num(b.w0) ?? 20, d0 = num(b.d0) ?? 6;
  const near = num(b.near), far = num(b.far), w = num(b.w), d = num(b.d);
  const c = (near !== null && far !== null) ? (near + far) / 2 : null;
  const s = c !== null ? 1 - c / c0 : null;
  const gW = (w !== null && s !== null) ? (w - w0 * (1 - s)) / 2 : (w !== null ? (w - w0) / 2 : null);
  const gD = (d !== null && s !== null) ? (d0 * (1 - s) - d) / 2 : (d !== null ? (d0 - d) / 2 : null);
  const g = gW !== null && gD !== null ? (gW + gD) / 2 : (gW ?? gD);
  return { c, s, gW, gD, g, scale: s !== null ? 1 / (1 - s) : null };
}
function volLimit(p){ const c = num(sd(p,"vol").clean); return c ? c * 0.85 : null; }

// ---------- steps ----------
const BED = "Bed: add a new build plate (the + next to the bed tabs) and select it before running. Towers keep their own per-layer G-code on their bed.";
const STEPS = [
  { id:"clean", n:0, name:"Nozzle clean", short:"Nozzle clean", share:"printer", cmd:"0. Nozzle clean before testing",
    purpose:"A clean hotend first, so the sheet measures the printer and not debris.",
    run:p=>[["Routine","cold_pull_nylon"],["High Flow / CHT nozzle","off"],["Tag",p.tag]],
    extra:p=>nozzleFilesHtml(p),
    look:["This step is not sliced. The plugin only names the maintenance file for the selected printer and nozzle; download it below (or take it from the plugin folder) onto the USB stick and run it like a print.","The file homes, parks high at the bed centre, heats to 290 °C, purges nylon, cools with the fan, then does the cold pull with the extruder at 145 °C and asks you to pull the filament out.","Load the filament the prompt names first and put a scrap of paper on the bed under the nozzle. The prompts say Continue; the printer's button says Resume.","The tip should be a clean cast of the nozzle bore; flecks or crust mean run it again. MK4S only: for a suspected clog run flow_test, hot_flush, flow_test, cold_pull_nylon, flow_test.","Do this once per printer, and again whenever a dialed-in machine drifts. No file ships for the XL, MINI or MK3: use the printer's own cold-pull routine."],
    fields:[{k:"material",label:"Cleaning filament",type:"select",opts:[["nylon","Nylon"],["pla","PLA"]]},{k:"done_by",label:"Method",type:"select",opts:[["usb","Maintenance file from USB"],["firmware","Firmware cold pull"],["manual","Manual cold pull"]]},{k:"notes",label:"What came out",type:"text",ph:"colour, debris"}],
    result:p=>[{l:"Nozzle",s:"baseline for every step below",v:sd(p,"clean").done?"clean":"—",big:!!sd(p,"clean").done}]},
  { id:"temp", n:1, name:"Temperature tower", short:"Temperature", share:"model", cmd:"1. Temperature tower",
    purpose:"Coolest temperature that still bonds layers and holds the bridges.",
    run:p=>[["Hottest","260"],["Coolest","235"],["By interval","on"],["Interval","5"],["Sections","6"],["Solid","on"],["Tag",p.tag]],
    look:["Bands are 10 mm tall, temperature engraved at the left of each front face.","Too cool: dull matte surface, sagging bridges, frayed overhangs.","Too hot: drooping corners and glassy blobs.","Snap the tower at a band boundary; the coolest band that does not break cleanly is the floor."],
    fields:[{k:"chosen",label:"Chosen temperature",unit:"°C",type:"number",step:1},{k:"notes",label:"Notes",type:"text"}],
    result:p=>{const t=num(sd(p,"temp").chosen);return[
      {l:"Nozzle",v:t?f(t,0)+" °C":"—",big:!!t},
      {l:"First layer",s:"10 °C cooler",v:t?f(t-10,0)+" °C":"—"}];}},
  { id:"vol", n:2, name:"Max volumetric flow", short:"Max flow", share:"model", cmd:"2. Max volumetric flow",
    purpose:"Fastest flow this hotend can melt cleanly, measured before the multiplier moves.",
    run:p=>[["Lowest","6"],["Highest","24"],["By interval","off"],["Interval","3"],["Sections","7"],["Section height","6"],["Comb","on"],["Width","(blank)"],["Write limits","off"],["Tag",p.tag]],
    look:["Set Max volumetric speed and the cooling slowdown to 0 first, or the profile caps the top bands.","Bands are labelled in mm³/s on the column beside the comb.","Find the first band with gaps, a matte rough wall, or extruder clicks.","Take the highest clean band."],
    fields:[{k:"clean",label:"Highest clean band",unit:"mm³/s",type:"number",step:0.5}],
    result:p=>{const l=volLimit(p);return[
      {l:"Max volumetric speed",s:"85% of the highest clean band",v:l?f(l,1)+" mm³/s":"—",big:!!l},
      {l:"Solid infill speed",s:"at "+f(p.nozzle*1.125,3)+" × "+f(p.layer,2)+" mm lines",v:l?f(l/extrusionArea(p.nozzle*1.125,p.layer),0)+" mm/s":"—",muted:true}];}},
  { id:"pa", n:3, name:"Pressure advance line", short:"Pressure advance", share:"printer", cmd:"3. Pressure advance › Line test (recommended)",
    purpose:"Pressure advance value that keeps line width even through the fast runs.",
    run:p=>[["Lowest","0.00"],["Highest","0.08"],["By interval","on"],["Interval","0.005"],["Lines","9"],["Slow speed","20"],["Fast speed","100"],["Spacing","5"],["Bed centre","0 (from the printer name: XL/XL+, CORE One/One+, CORE One L/L+, MK4S; others type half the bed size)"],["Retraction","0.8"],["Firmware","prusa"],["Tag",p.tag]],
    look:["The pattern is first-layer G-code on an anchor plate; check its position in the preview.","Each line's value is written beside it in extruded digits.","Pick the line whose fast middle run is the same width as its slow ends.","Too little: thin start, fat blob at the end. Too much: fat start, gap at the end."],
    fields:[{k:"chosen",label:"Chosen value",unit:"",type:"number",step:0.001},{k:"notes",label:"Notes",type:"text"}],
    result:p=>{const v=num(sd(p,"pa").chosen);return[
      {l:"Pressure advance",s:"step 13 writes mode and value",v:v!==null?f(v,3):"—",big:v!==null},
      {l:"Firmware command",s:"inserted per line",v:v!==null?"M572 S"+f(v,3):"—",muted:true}];}},
  { id:"flow", n:4, name:"Flow staircase (M221)", short:"Flow", share:"printer", cmd:"4. Flow staircase (M221)",
    purpose:"Coarse extrusion multiplier, swept one M221 value per chip.",
    run:p=>{const m=flowMethod(p);const w=flowWinner(p);const rows=[];
      const sweep=(lo,hi,iv,n)=>{rows.push(["Lowest",lo],["Highest",hi],["By interval","on"],["Interval",iv],["Chips",n]);};
      if(m==="twopass"){ if(w===null) sweep("-20","+20","5","9"); else { sweep("-9","0","1","10"); rows.push(["Pass","2"]); } }
      else sweep("-5","+5","1","11");

// Gates: the steps whose results are inputs to this one. Advice only — a blocked step can still
// be edited and run. The order follows OrcaSlicer's: temperature, volumetric, PA, flow, then mass.
const GATES = {
  clean:[], temp:["clean"], vol:["temp"], pa:["vol"], flow:["pa"], slab:["flow"], cooling:["slab"],
  overlap:["slab"], bar:["slab"], gauge:["slab"], small:["cooling"], coupon:["slab","cooling"],
  string:["flow"], apply:["temp"]
};
function stepDone(p, id){ return !!(p.steps[id] && p.steps[id].done); }
function blockedBy(p, id){ return (GATES[id] || []).filter(g => !stepDone(p, g)).map(g => STEPS.find(s => s.id === g)).filter(Boolean); }
function isReady(p, id){ return blockedBy(p, id).length === 0; }

// Steps that must be printed with an earlier result already applied.
// Returns warning strings from the last DATA line's preset snapshot.
function consistencyWarnings(p){
  const w = [];
  if (p.baselineWarning) w.push(p.baselineWarning);
  const snap = p.lastSnapshot; if (!snap) return w;
  const order = STEPS.map(s => s.id); const at = order.indexOf(snap.step);
  const atN = STEPS[at] ? STEPS[at].n : at;
  const t = num(sd(p,"temp").chosen);
  if (t && at > order.indexOf("temp") && snap.p_temperature && snap.p_temperature !== t)
    w.push(`Step ${atN} printed at ${snap.p_temperature} °C but step ${stepNumber("temp")} chose ${t} °C; apply it first.`);
  const pa = num(sd(p,"pa").chosen);
  if (pa !== null && at > order.indexOf("pa") && snap.p_pressure_advance != null && Math.abs(snap.p_pressure_advance - pa) > 0.0005)
    w.push(`Step ${atN} printed with pressure advance ${f(snap.p_pressure_advance,3)} but step ${stepNumber("pa")} chose ${f(pa,3)}; apply it first.`);
  const m = multiplierAfterFlow(p);
  const target = multiplierAfterSlab(p) ?? m;
  if (flowChosen(p) && at > order.indexOf("flow") && snap.p_extrusion_multiplier && Math.abs(snap.p_extrusion_multiplier - target) > 0.0015 && Math.abs(snap.p_extrusion_multiplier - m) > 0.0015)
    w.push(`Step ${atN} printed with multiplier ${f(snap.p_extrusion_multiplier,4)} but the dialed-in value is ${f(target,4)}; apply it first.`);
  return w;
}

function stepNumber(id){ const s = STEPS.find(x => x.id === id); return s ? s.n : "?"; }
function stepStatus(p, st){
  const d = p.steps[st.id]; if (!d) return "";
  if (d.done) return "done";
  return Object.keys(d).some(k => k !== "done" && d[k] !== "" && d[k] !== null && d[k] !== undefined) ? "partial" : "";
}

// Progress is counted over the thirteen measured steps; step 13 applies them.
const PROGRESS = STEPS.filter(s => s.id !== "apply");
function doneCount(p){ return PROGRESS.filter(s => stepDone(p, s.id)).length; }
function firstTodo(p){ const s = STEPS.find(x => !stepDone(p, x.id)); return s ? s.id : "apply"; }
function dotClass(p, st){
  if (stepDone(p, st.id)) return "done";
  if (stepStatus(p, st) === "partial") return "partial";
  return isReady(p, st.id) ? "ready" : "blocked";
}
function isStepView(){ return !(state.step === "welcome" || state.step === "new" || state.step === "plan" || state.step === "compare"); }

function commitDraft(existing){
  const tag = (draft.tag || "").trim();
  if (!tag) { toast("The tag is required"); const t = $("#tagIn"); if (t) t.focus(); return; }
  // the tag is how a DATA line tells two dial-ins on one printer apart, so it must be unique
  if (state.printers.some(x => x.tag === tag && x.id !== (existing ? existing.id : null))) {
    toast("Another dial-in already uses the tag " + tag); const t = $("#tagIn"); if (t) t.focus(); return;
  }
  const material = draftMaterial().trim() || "Prusament PETG";
  const name = (draft.name || "").trim() || psName(draft.model, draft.nozzle) || (material + " " + tag);
  const p = existing || blankPrinter(name, tag);
  p.name = name; p.tag = tag; p.model = draft.model; p.nozzle = +draft.nozzle || 0.4;
  p.filament = material; p.spool = (draft.spool || "").trim();
  p.presetName = (draft.presetName || "").trim() || presetDefault(material, tag);
  p.layer = +draft.layer || 0.2; p.density = +draft.density || 1.27; p.baseMultiplier = +draft.mult || 1.0;
  p.example = false;

function renderCompare(){

    return ms ? ((ms/n.g-1)*100>0?"+":"") + f((ms/n.g-1)*100,2) + " %" : null; };
  const COMPARE_ROWS = [
    ["Temperature",      p => num(sd(p,"temp").chosen) ? f(sd(p,"temp").chosen,0) + " °C" : null],
    ["Flow M221",        p => flowChosen(p) ? f(flowChosen(p),0) + " %" : null],
    ["Slab error",       slabErr],
    ["Multiplier",       p => finalMultiplier(p) ? f(finalMultiplier(p),4) : null],
    ["Max flow",         p => volLimit(p) ? f(volLimit(p),1) + " mm³/s" : null],
    ["Pressure advance", p => num(sd(p,"pa").chosen)!==null ? f(sd(p,"pa").chosen,3) : null],
    ["Fan",              p => num(sd(p,"cooling").chosen)!==null ? f(sd(p,"cooling").chosen,0) + " %" : null],
    ["Overlap",          p => num(sd(p,"overlap").chosen) ? f(sd(p,"overlap").chosen,0) + " %" : null],
    ["XY compensation",  p => barResult(p).g!==null ? f(-barResult(p).g,3) + " mm" : null],
    ["Shrinkage",        p => barResult(p).s!==null ? f(barResult(p).s*100,2) + " %" : null],
    ["Steps done",       p => doneCount(p) + " of " + PROGRESS.length]
  ];

async function loadLatest(btn){

  try {
    const r = (await api("/api/update", {})).result || {};
    const bits = [r.version ? "v" + r.version : null, r.commit_short].filter(Boolean).join(" · ");
    // The helper replaced its own file but cannot re-exec while it is serving
    // this request, so it only reports the restart. No reload: the page comes
    // back when the helper does.
    if (r.helper_restart) { toast("helper updated: close the helper window and double-click Dial-In Sheet.cmd again"); render(); return; }
    toast("Loaded latest plugin" + (bits ? ": " + bits : "") + (r.same_commit ? ", reinstalled" : ""));
    if (r.changed) { reloading = true; setTimeout(() => location.reload(), 1400); return; }
    render();
  } catch (e) {

}
function closeHelperPop(){
  const p = $("#helperPop"); if (p) p.hidden = true;
  const c = $("#hcluster .hchip"); if (c) c.setAttribute("aria-expanded", "false");
}
function toggleHelperPop(){
  const p = $("#helperPop"); if (!p) return;
  p.hidden = !p.hidden;
  const c = $("#hcluster .hchip"); if (c) c.setAttribute("aria-expanded", p.hidden ? "false" : "true");
}
document.addEventListener("click", e => { if (!e.target.closest("#hcluster")) closeHelperPop(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeHelperPop(); });
function startLog(){
  const drawer = document.createElement("div"); drawer.className = "log"; drawer.id = "logDrawer";
  drawer.innerHTML = `<div class="bar" id="logBar"><span class="lgt">Log</span><span class="lgn" id="logCount">0</span><span class="grow"></span><button class="btn" id="logClear" type="button">Clear</button></div><ol id="logList"></ol>`;
  document.body.appendChild(drawer);
  try { if (localStorage.getItem(KEY + ":logmin") === "1") drawer.classList.add("min"); } catch(e){}
  $("#logBar").addEventListener("click", () => { drawer.classList.toggle("min"); try { localStorage.setItem(KEY + ":logmin", drawer.classList.contains("min") ? "1" : "0"); } catch(e){} });
  let n = 0;
  $("#logClear").addEventListener("click", e => { e.stopPropagation(); $("#logList").innerHTML = ""; n = 0; $("#logCount").textContent = "0"; });
  const es = new EventSource("/api/log?since=0");
  es.onmessage = e => {
    const ev = JSON.parse(e.data); if (ev.id <= helperSeen) return; helperSeen = ev.id;
    if (ev.kind === "slicer") return;
    n++; $("#logCount").textContent = n;
    const li = document.createElement("li"); li.className = "ev-" + ev.kind; li.textContent = (ev.kind === "data" ? "DATA " + JSON.stringify(ev.data) : ev.text); $("#logList").appendChild(li); $("#logList").scrollTop = 1e9;
    if (ev.kind === "data") onData(ev.data);
    if (ev.kind === "helper" && /launched|exited|installed|loaded|wrote/.test(ev.text)) fetch("/api/status").then(r=>r.json()).then(j=>{ helper=j; renderHelperBar(); }).catch(()=>{});
  };
}
function renderHelperBar(){ const el = $("#helperBar"); if (el) el.innerHTML = helperBar(); }
let unmatchedData = "";
function onData(d){
  if (!d || !d.printer) return;
  // The tag is engraved on every test part and is unique, so it decides first; the printer
  // name can be shared by two dial-ins, and then a real one beats the example.
  let p = null;
  if (d.tag) {
    const t = String(d.tag).trim(), tl = t.toLowerCase();
    p = state.printers.find(x => x.tag === t) || state.printers.find(x => String(x.tag || "").trim().toLowerCase() === tl);
  }
  if (!p) p = state.printers.find(x => x.name === d.printer && !x.example) || state.printers.find(x => x.name === d.printer);
  if (!p) {
    if (unmatchedData !== d.printer) { unmatchedData = d.printer; toast("DATA from " + d.printer + " — no dial-in with that printer or tag"); }
    return;
  }
  unmatchedData = "";
  if (p.example) { p.steps = {}; p.example = false; if (d.tag) p.tag = d.tag; toast("Replaced the example's numbers with your " + d.printer); }
  else if (!p.tag && d.tag) p.tag = d.tag;
  state.active = p.id;
  const st = sd(p, d.step);
  if (d.layer_height) {
    const base = { layer_height: d.layer_height, nozzle: d.nozzle, perimeters: d.p_perimeters, top: d.p_top_solid_layers, bottom: d.p_bottom_solid_layers };
    if (!p.baseline) { p.baseline = base; p.baselineStep = d.step; p.layer = d.layer_height; if (d.nozzle) p.nozzle = d.nozzle; }
    else {
      const diffs = [];
      for (const [k, label] of [["layer_height","layer height"],["nozzle","nozzle"],["perimeters","perimeters"],["top","top solid layers"],["bottom","bottom solid layers"]])
        if (base[k] != null && p.baseline[k] != null && Math.abs(base[k] - p.baseline[k]) > 1e-6) diffs.push(`${label} ${p.baseline[k]} → ${base[k]}`);
      p.baselineWarning = diffs.length ? `The printer or print profile changed since step ${stepNumber(p.baselineStep)}: ${diffs.join(", ")}. Every step must use the same printer, nozzle, layer height and print profile; change one variable at a time. Re-run this step, or reset the baseline under Edit.` : null;
      if (p.baselineWarning) toast("Profile changed since the earlier steps");
    }
    p.lastSnapshot = { step: d.step, p_temperature: d.p_temperature, p_extrusion_multiplier: d.p_extrusion_multiplier, p_max_volumetric_speed: d.p_max_volumetric_speed, p_pressure_advance: d.p_pressure_advance };
  }
  if (d.baseline_mismatch) { p.baselineWarning = "PrusaSlicer reports: " + d.baseline_mismatch; toast("Layer height or nozzle differs from profile.lua"); }
  if (d.step === "slab") { st.x = d.x; st.y = d.y; st.z = d.z; st.posts = !!d.posts; if (d.density) p.density = d.density; if (d.extrusion_multiplier) st.printed_em = d.extrusion_multiplier; st.slicer_expected_g = d.expected_g; }
  if (d.step === "bar") { st.c0 = d.c0; st.w0 = d.width; st.d0 = d.hole; }
  if (d.step === "coupon") { st.l0 = d.length; st.w0 = d.width; st.h0 = d.height; st.hole0 = d.hole; if (d.foot) st.foot = d.foot; }
  if (d.step === "flow" && d.extrusion_multiplier) p.baseMultiplier = d.extrusion_multiplier;
  if (STEPS.some(s => s.id === d.step)) state.step = d.step;
  save(); render();
}

function render(){
  renderTopbar();
  renderRail();
  const st = STEPS.find(s => s.id === state.step);
  if (state.step === "welcome") renderWelcome();
  else if (state.step === "new") renderNewDialIn(null);
  else if (state.step === "edit") renderNewDialIn(printer());
  else if (st) renderStep(st);
  else if (state.step === "plan") renderPlan();
  else renderCompare();
  save();
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1600); }

// ---------- events ----------
document.addEventListener("click", e => {
  const op = e.target.closest("[data-open]");
  if (op) { state.active = op.dataset.open; draft = null; state.step = firstTodo(printer()); render(); window.scrollTo({top:0}); return; }
  const sb = e.target.closest("[data-step]");
  if (sb) {
    const to = sb.dataset.step;
    if (to === "edit") editReturn = STEPS.some(s => s.id === state.step) ? state.step : "welcome";
    if (to !== "new" && to !== "edit") draft = null;
    state.step = to; render(); window.scrollTo({top:0}); return;
  }
  const go = e.target.closest("[data-go]"); if (go) { state.step = go.dataset.go; render(); window.scrollTo({top:0}); return; }
  const ac = e.target.closest("[data-act]");
  if (ac) {
    const a = ac.dataset.act;
    if (a === "preset") openSavePreset();
    else if (a === "export") openExportJson();
    else if (a === "reset" && confirm("Clear every dial-in and measurement in this browser?")) {
      state = { printers:[examplePrinter()], active:"ex1", step:"welcome" }; draft = null; save(); render();
    }
    return;
  }
  const hb = e.target.closest("[data-helper]"); if (hb) { helperAction(hb.dataset.helper, hb); return; }
});
document.addEventListener("change", e => {
  if (e.target.id === "dialinSelect") { state.active = e.target.value; draft = null; state.step = firstTodo(printer()); render(); window.scrollTo({top:0}); }
});
$("#exportCopy").addEventListener("click", () => {
  const ta = $("#exportText"); ta.select();
  const done = () => toast("Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
});
$("#exportWrite").addEventListener("click", async () => { await helperAction("preset"); closeDialog($("#exportDialog")); });
$("#exportDownload").addEventListener("click", () => { const p = printer(); downloadText(presetFileName(p), presetYaml(p)); });
$("#exportBase").addEventListener("input", e => { const p = printer(); p.baseFilament = e.target.value; save(); $("#exportText").value = presetYaml(p); });
$("#exportClose").addEventListener("click", () => closeDialog($("#exportDialog")));
$("#pathsClose").addEventListener("click", () => closeDialog($("#pathsDialog")));
$("#pathsSave").addEventListener("click", async () => {
  try { await api("/api/config", { prusaslicer: $("#pathPrusa").value.trim(), plugins_dir: $("#pathPlugins").value.trim() }); toast("Paths saved"); closeDialog($("#pathsDialog")); render(); }
  catch (e) { toast(e.message); }
});
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => { const s = JSON.parse(t); if (!s.printers) throw new Error("no printers"); state = migrate(s); draft = null; save(); render(); toast("Imported"); })
    .catch(() => toast("That file is not a dial-in sheet export"));
  e.target.value = "";
});
$("#railToggle").addEventListener("click", () => $("#rail").classList.toggle("collapsed"));
if (window.matchMedia("(max-width:760px)").matches) $("#rail").classList.add("collapsed");

render();
detectHelper();
})();
</script>
</body>
