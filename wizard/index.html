<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PETG Dial-In Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F1F3F1; --sheet:#FBFBFA; --rail:#E6E9E7; --line:#CBD1CD; --line-soft:#DDE2DF;
  --ink:#1B2320; --ink-2:#4B5651; --ink-3:#7A857F;
  --accent:#D9581F; --accent-ink:#FFFFFF; --accent-soft:#F8E4D8;
  --good:#2F7D4F; --good-soft:#DDEFE3; --warn:#A87413; --warn-soft:#F6EBD0; --bad:#B03A2E; --bad-soft:#F5DCD8;
  --focus:#1F6FB2;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151A18; --sheet:#1D2422; --rail:#101513; --line:#3A4441; --line-soft:#2C3532;
    --ink:#E7ECE8; --ink-2:#AEB8B2; --ink-3:#7D8883;
    --accent:#EE7A3F; --accent-ink:#14100D; --accent-soft:#3A2418;
    --good:#6CC08B; --good-soft:#1E3327; --warn:#E0B24F; --warn-soft:#3A2F12; --bad:#E5776B; --bad-soft:#3D1F1B;
    --focus:#6FB2F0;
  }
}
:root[data-theme="dark"]{
  --paper:#151A18; --sheet:#1D2422; --rail:#101513; --line:#3A4441; --line-soft:#2C3532;
  --ink:#E7ECE8; --ink-2:#AEB8B2; --ink-3:#7D8883;
  --accent:#EE7A3F; --accent-ink:#14100D; --accent-soft:#3A2418;
  --good:#6CC08B; --good-soft:#1E3327; --warn:#E0B24F; --warn-soft:#3A2F12; --bad:#E5776B; --bad-soft:#3D1F1B;
  --focus:#6FB2F0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:20px 16px 28px;display:flex;flex-direction:column;gap:22px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.printer-list{display:flex;flex-direction:column;gap:4px}
.printer-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer}
.printer-btn:hover{background:var(--sheet)}
.printer-btn[aria-current="true"]{background:var(--sheet);border-color:var(--line)}
.printer-btn .tag{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.steps{display:flex;flex-direction:column;gap:2px}
.step-btn{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;padding:7px 8px;cursor:pointer;color:var(--ink-2)}
.step-btn:hover{background:var(--sheet)}
.step-btn[aria-current="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink)}
.step-btn .num{font-family:var(--display);font-weight:600;font-size:20px;line-height:1;color:var(--ink-3)}
.step-btn[aria-current="true"] .num{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--good)}
.dot.partial{background:var(--warn)}
.rail-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.btn{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad)}
main{padding:28px 32px 64px;max-width:1040px;width:100%}
.sheet-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.sheet-head h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.sheet-head h1 .n{color:var(--accent);margin-right:10px}
.sheet-head .who{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right}
.sheet-head .who b{color:var(--ink);font-weight:500}
.purpose{max-width:66ch;color:var(--ink-2);margin:0 0 22px;font-size:15.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.block{background:var(--sheet);border:1px solid var(--line-soft);border-radius:8px;padding:16px 18px 18px}
.block h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.block h2 .k{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink-3)}
.bed{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 12px}
.cmd{font-family:var(--mono);font-size:13px;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;margin:0 0 12px;word-break:break-word}
table.vals{width:100%;border-collapse:collapse;font-size:13.5px}
table.vals td{padding:5px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.vals td:last-child{text-align:right;font-family:var(--mono);white-space:nowrap;padding-left:12px}
table.vals tr:last-child td{border-bottom:0}
.look{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--ink-2)}
.look li{margin:4px 0}
.fields{display:grid;grid-template-columns:1fr;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 150px;align-items:center;gap:12px}
.field label{font-size:13.5px}
.field label small{display:block;color:var(--ink-3);font-size:12px}
.field .in{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.field input[type=number],.field input[type=text],.field select{width:100%;max-width:150px;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-family:var(--mono);font-size:13.5px;text-align:right}
.field input[type=text]{font-family:var(--body);text-align:left}
.field .unit{font-family:var(--mono);font-size:12px;color:var(--ink-3);min-width:34px}
.field.wide{grid-template-columns:1fr}
.field.wide input[type=text]{max-width:none}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.res:last-child{border-bottom:0}
.res .l{font-size:13.5px}
.res .l small{display:block;color:var(--ink-3);font-size:12px}
.res .v{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .v.big{font-size:26px;color:var(--accent)}
.res .v.muted{color:var(--ink-3);font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);vertical-align:middle}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.done-row label{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.done-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.nav{display:flex;gap:8px}
.summary-text{font-family:var(--mono);font-size:13px;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line-soft);border-radius:6px;padding:12px;margin:0}
.compare{overflow-x:auto}
.compare table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
.compare th,.compare td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.compare th{font-family:var(--body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.compare th:first-child,.compare td:first-child{text-align:left;font-family:var(--body)}
.printer-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.printer-form .field{grid-template-columns:1fr}
.printer-form .field input{max-width:none;text-align:left}
.note{font-size:13px;color:var(--ink-3);margin:10px 0 0}
.example-flag{font-size:12px;color:var(--warn);font-weight:500}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.export{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px 20px;width:min(640px,calc(100vw - 32px))}
.export::backdrop{background:rgba(0,0,0,.45)}
.export h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 6px}
.export p{margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}
.export textarea{width:100%;height:220px;font-family:var(--mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
.export-actions{display:flex;gap:8px;margin-top:10px}
.helper{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:13px}
.helper .st{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.helper .st .dot{width:8px;height:8px}
.helper .grow{flex:1 1 auto}
.log{position:fixed;right:0;bottom:0;left:272px;background:var(--rail);border-top:1px solid var(--line);z-index:5;max-height:38vh;display:flex;flex-direction:column}
.log.min{max-height:none}
.log .bar{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.log .bar .grow{flex:1}
.log ol{list-style:none;margin:0;padding:0 14px 10px;overflow:auto;font-family:var(--mono);font-size:12px;line-height:1.5}
.log.min ol{display:none}
.log li{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.log li.ev-plugin{color:var(--ink)}
.log li.ev-data{color:var(--good)}
.log li.ev-warning{color:var(--warn)}
.log li.ev-error{color:var(--bad)}
.log li.ev-helper{color:var(--accent)}
.log li.ev-slicer{color:var(--ink-3)}
body.has-log main{padding-bottom:42vh}
@media (max-width:760px){.log{left:0}}
.warnbar{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--ink);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px;margin:0 0 16px}
.warnbar + .warnbar{margin-top:-8px}
.rail-toggle{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .rail.collapsed .steps,.rail.collapsed .printer-list,.rail.collapsed .rail-actions,.rail.collapsed .eyebrow{display:none}
  .rail-toggle{display:inline-block}
  main{padding:20px 16px 48px}
  .sheet-head h1{font-size:34px}
  .field{grid-template-columns:1fr}
  .field .in{justify-content:flex-start}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">PETG Dial-In Sheet<small>PrusaSlicer 3.0 calibration suite</small> <button class="btn small rail-toggle" id="railToggle" type="button">Menu</button></div>
    <div>
      <p class="eyebrow">Printers</p>
      <div class="printer-list" id="printerList"></div>
      <div class="rail-actions" style="margin-top:8px"><button class="btn small" id="addPrinter" type="button">Add printer</button></div>
    </div>
    <div>
      <p class="eyebrow">Steps</p>
      <div class="steps" id="stepList"></div>
    </div>
    <div class="rail-actions">
      <button class="btn small" id="exportBtn" type="button">Export JSON</button>
      <label class="btn small" for="importFile" style="cursor:pointer">Import JSON</label>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn small danger" id="resetBtn" type="button">Clear all</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="export" id="pathsDialog" aria-labelledby="pathsTitle">
  <h2 id="pathsTitle">Paths</h2>
  <p>Point the helper at the PrusaSlicer you are calibrating with. Both are remembered.</p>
  <div class="fields">
    <div class="field wide"><label for="pathPrusa">PrusaSlicer folder or executable<small>the unpacked portable zip folder is fine, e.g. C:\Users\now\Downloads\PrusaSlicer-3.0.0-alpha11\PrusaSlicer-3.0.0-alpha11</small></label><input type="text" id="pathPrusa" spellcheck="false"></div>
    <div class="field wide"><label for="pathPlugins">Plugins folder<small>in that PrusaSlicer: Plugins › Show User Plugins Folder, then paste the path (its parent data folder also works)</small></label><input type="text" id="pathPlugins" spellcheck="false"></div>
  </div>
  <div class="export-actions"><button class="btn primary" id="pathsSave" type="button">Save paths</button><button class="btn" id="pathsClose" type="button">Cancel</button></div>
</dialog>
<dialog class="export" id="exportDialog" aria-labelledby="exportTitle">
  <h2 id="exportTitle">Export sheet</h2>
  <p>Copy this and save it as <code>petg-dialin-sheet.json</code>. Import it on another machine with Import JSON.</p>
  <textarea id="exportText" readonly spellcheck="false"></textarea>
  <div class="export-actions"><button class="btn primary" id="exportCopy" type="button">Copy JSON</button><button class="btn" id="exportClose" type="button">Close</button></div>
</dialog>

<script>
(function(){
"use strict";
const KEY = "petg-dialin-sheet-v1";

// ---------- state ----------
function examplePrinter(){
  return {
    id: "ex1", name: "Original Prusa MK4S 0.4 nozzle", tag: "MK4S 0.4", example: true,
    filament: "Prusament PETG Jet Black", density: 1.27, baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2,
    steps: {
      temp: { chosen: 245, notes: "Gloss even from 250 down; 240 wing started to fray", done: true },
      flow: { pass1: 100, pass2: 98, done: true },
      pa:   { chosen: 0.045, done: true },
      vol:  { clean: 18, done: true },
      slab: { x: 60, y: 60, z: 20, posts: true, measured: 94.10, printed_em: 0.98, done: true },
      overlap:{ chosen: 15, done: true },
      bar:  { c0: 130, w0: 20, d0: 6, near: 123.55, far: 135.50, w: 20.09, d: 5.86, done: true },
      coupon:{ l: 49.97, w: 24.98, h: 10.02, hole: 9.94, foot: 0.15, overhang: "45° wing clean, slight droop at the tip", fins: "0.8 fin has gaps, 1.2 and 1.6 fine", done: false },
      string:{ temp: 245, fan: 30, done: false },
      apply:{ done: false }
    }
  };
}
function blankPrinter(name, tag){
  return { id: "p" + Date.now().toString(36), name, tag, example: false, filament: "Prusament PETG", density: 1.27,
    baseMultiplier: 1.0, nozzle: 0.4, layer: 0.2, steps: {} };
}
let state = load();
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.printers && s.printers.length) return s; } catch(e){}
  return { printers: [examplePrinter()], active: "ex1", step: "temp" };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
function printer(){ return state.printers.find(p => p.id === state.active) || state.printers[0]; }
function sd(p, id){ p.steps[id] = p.steps[id] || {}; return p.steps[id]; }

// ---------- arithmetic ----------
const num = v => (v === "" || v === null || v === undefined || isNaN(+v)) ? null : +v;
const f = (v, d) => v === null || v === undefined || !isFinite(v) ? "—" : (+v).toFixed(d);
function extrusionArea(w, h){ return (w - h) * h + Math.PI * (h / 2) ** 2; }
function flowChosen(p){ const f = sd(p,"flow"); return num(f.pass2) ?? num(f.pass1); }
function multiplierAfterFlow(p){ const c = flowChosen(p); return c ? p.baseMultiplier * c / 100 : p.baseMultiplier; }
function slabNominal(p){
  const s = sd(p,"slab"); const x = num(s.x) ?? 60, y = num(s.y) ?? 60, z = num(s.z) ?? 20;
  let mm3 = x * y * z; if (s.posts !== false) mm3 += 4 * 6 * 6 * 12;
  return { cm3: mm3 / 1000, g: mm3 / 1000 * (num(p.density) ?? 1.27) };
}
function slabBaseMultiplier(p){ return num(sd(p,"slab").printed_em) ?? multiplierAfterFlow(p); }
function multiplierAfterSlab(p){
  const m = num(sd(p,"slab").measured); const n = slabNominal(p);
  return m ? slabBaseMultiplier(p) * n.g / m : null;
}
function finalMultiplier(p){ return multiplierAfterSlab(p) ?? (flowChosen(p) ? multiplierAfterFlow(p) : null); }
function barResult(p){
  const b = sd(p,"bar"); const c0 = num(b.c0) ?? 130, w0 = num(b.w0) ?? 20, d0 = num(b.d0) ?? 6;
  const near = num(b.near), far = num(b.far), w = num(b.w), d = num(b.d);
  const c = (near !== null && far !== null) ? (near + far) / 2 : null;
  const s = c !== null ? 1 - c / c0 : null;
  const gW = (w !== null && s !== null) ? (w - w0 * (1 - s)) / 2 : (w !== null ? (w - w0) / 2 : null);
  const gD = (d !== null && s !== null) ? (d0 * (1 - s) - d) / 2 : (d !== null ? (d0 - d) / 2 : null);
  const g = gW !== null && gD !== null ? (gW + gD) / 2 : (gW ?? gD);
  return { c, s, gW, gD, g, scale: s !== null ? 1 / (1 - s) : null };
}
function volLimit(p){ const c = num(sd(p,"vol").clean); return c ? c * 0.85 : null; }

// ---------- steps ----------
const BED = "Bed: add a new build plate (the + next to the bed tabs) and select it before running. Towers keep their own per-layer G-code on their bed.";
const SEL = (unit, intervalDefault, countDefault) => [["Choose by interval (on) / by sections (off)","on"],["Interval",intervalDefault+unit],["Number of sections (when interval is off)",String(countDefault)]];
const STEPS = [
  { id:"temp", n:1, name:"Temperature tower", cmd:"1. Temperature tower",
    purpose:"Find the coolest temperature that still bonds layers and holds Prusa's bridge and overhang features. Thick solid parts stay warm between layers, so lean toward the cool end of what looks good. This is PrusaSlicer's own calibration model, printed solid.",
    run:p=>[["Hottest section (bottom)","260"],["Coolest section (top)","235"],...SEL(" °C","5",6),["Print at 100% infill","on"],["Printer tag",p.tag]],
    look:["Bands are 10 mm tall and engraved with their temperature at the left of the front face; hottest at the bottom.","Reject bands with sagging bridges, frayed overhangs, a dull matte surface (too cool) or drooping corners and glassy blobs (too hot).","Snap the tower at a band boundary: the coolest band that does not break cleanly is your floor."],
    fields:[{k:"chosen",label:"Chosen temperature",unit:"°C",type:"number",step:1},{k:"notes",label:"Notes",type:"text",wide:true}],
    result:p=>{const t=num(sd(p,"temp").chosen);return[
      {l:"Nozzle temperature",v:t?f(t,0)+" °C":"—",big:!!t},
      {l:"First layer temperature",s:"Prusa's PETG profile runs the first layer 10 °C cooler",v:t?f(t-10,0)+" °C":"—"}];}},
  { id:"flow", n:2, name:"Flow staircase (M221)", cmd:"2. Flow staircase (M221)",
    purpose:"OrcaSlicer's two-pass flow method, built as a staircase because PrusaSlicer cannot set flow per object: every tread is a patch printed at its own M221 value, and you judge each tread's top surface. Pass 1 sweeps 80 to 120% in 5% steps; pass 2 sweeps 1% steps around the pass-1 winner. Apply the chosen temperature from step 1 first.",
    run:p=>{const a=num(sd(p,"flow").pass1);return a?[["Pass 2 — Lowest flow (bottom)",f(a-4,0)],["Highest flow (top)",f(a+4,0)],...SEL(" %","1",9),["Printer tag",p.tag]]:[["Pass 1 — Lowest flow (bottom)","80"],["Highest flow (top)","120"],...SEL(" %","5",9),["Printer tag",p.tag]]},

// Steps that must be printed with an earlier result already applied.
// Returns warning strings from the last DATA line's preset snapshot.
function consistencyWarnings(p){
  const w = [];
  if (p.baselineWarning) w.push(p.baselineWarning);
  const snap = p.lastSnapshot; if (!snap) return w;
  const order = STEPS.map(s => s.id); const at = order.indexOf(snap.step);
  const t = num(sd(p,"temp").chosen);
  if (t && at > order.indexOf("temp") && snap.p_temperature && snap.p_temperature !== t)
    w.push(`Step ${at+1} was printed at ${snap.p_temperature} °C but step 1 chose ${t} °C. Apply the temperature first (step 10 or Tools › Apply values from profile.lua).`);
  const pa = num(sd(p,"pa").chosen);
  if (pa !== null && at > order.indexOf("pa") && snap.p_pressure_advance != null && Math.abs(snap.p_pressure_advance - pa) > 0.0005)
    w.push(`Step ${at+1} was printed with pressure advance ${f(snap.p_pressure_advance,3)} in the preset but step 3 chose ${f(pa,3)}. Apply it first (or the preset's PA mode is disabled and start G-code sets it).`);
  const m = multiplierAfterFlow(p);
  const target = multiplierAfterSlab(p) ?? m;
  if (flowChosen(p) && at > order.indexOf("flow") && snap.p_extrusion_multiplier && Math.abs(snap.p_extrusion_multiplier - target) > 0.0015 && Math.abs(snap.p_extrusion_multiplier - m) > 0.0015)
    w.push(`Step ${at+1} was printed with extrusion multiplier ${f(snap.p_extrusion_multiplier,4)} but the dialed-in value is ${f(target,4)}. Apply it first.`);
  return w;
}

// ---------- render ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function stepStatus(p, st){
  const d = p.steps[st.id]; if (!d) return "";
  if (d.done) return "done";
  return Object.keys(d).some(k => k !== "done" && d[k] !== "" && d[k] !== null && d[k] !== undefined) ? "partial" : "";
}
function renderRail(){
  const p = printer();
  $("#printerList").innerHTML = state.printers.map(x => `<button class="printer-btn" type="button" data-printer="${x.id}" aria-current="${x.id===p.id}"><span>${esc(x.name)}${x.example?' <span class="example-flag">example</span>':''}</span><span class="tag">${esc(x.tag)}</span></button>`).join("");
  const items = STEPS.map(st => `<button class="step-btn" type="button" data-step="${st.id}" aria-current="${state.step===st.id}"><span class="num">${st.n}</span><span>${esc(st.name)}</span><span class="dot ${stepStatus(p,st)}"></span></button>`);
  items.push(`<button class="step-btn" type="button" data-step="printer" aria-current="${state.step==="printer"}"><span class="num">·</span><span>Printer details</span><span class="dot"></span></button>`);
  items.push(`<button class="step-btn" type="button" data-step="compare" aria-current="${state.step==="compare"}"><span class="num">≡</span><span>Compare printers</span><span class="dot"></span></button>`);
  $("#stepList").innerHTML = items.join("");
}
function fieldHtml(st, d, fl){
  const id = `f-${st.id}-${fl.k}`; const v = d[fl.k] ?? "";
  let input;
  if (fl.type === "select") input = `<select id="${id}" data-field="${fl.k}">${fl.opts.map(([ov,ol])=>`<option value="${ov}" ${String(v===""?"true":v)===ov?"selected":""}>${ol}</option>`).join("")}</select>`;
  else if (fl.type === "text") input = `<input type="text" id="${id}" data-field="${fl.k}" value="${esc(v)}" placeholder="${esc(fl.ph||"")}">`;
  else input = `<input type="number" id="${id}" data-field="${fl.k}" value="${esc(v)}" step="${fl.step||1}" inputmode="decimal" placeholder="${esc(fl.ph||"")}">`;
  return `<div class="field ${fl.wide?"wide":""}"><label for="${id}">${esc(fl.label)}</label><div class="in">${input}${fl.unit?`<span class="unit">${fl.unit}</span>`:""}</div></div>`;
}
function resultsHtml(st, p){
  if (!st.result) return "";
  return st.result(p).map(r => `<div class="res"><div class="l">${esc(r.l)}${r.s?`<small>${esc(r.s)}</small>`:""}</div><div class="v ${r.big?"big":""} ${r.muted?"muted":""}">${esc(r.v)}${r.pill?` <span class="pill ${r.pill[0]}">${r.pill[1]}</span>`:""}</div></div>`).join("");
}
function renderStep(st){

  $("#main").innerHTML = `<div id="helperBar">${helperBar()}</div>${warns}
    <div class="sheet-head"><h1><span class="n">${st.n}</span>${esc(st.name)}</h1><div class="who"><b>${esc(p.name)}</b><br>${esc(p.tag)} · ${esc(p.filament)} · current multiplier ${f(p.baseMultiplier,4)}</div></div>

      <section class="block"><h2><span class="k">A</span>Run in PrusaSlicer</h2>${beds}<div class="cmd">Plugins › Filament Dial-In › ${esc(st.cmd)}</div><table class="vals">${st.run(p).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table><ul class="look">${st.look.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>

        ${st.result?`<section class="block"><h2><span class="k">C</span>Result</h2><div class="results" id="results">${resultsHtml(st,p)}</div></section>`:`<section class="block"><h2><span class="k">C</span>Hand-off</h2><pre class="summary-text" id="summary">${esc(summaryText(p))}</pre><div style="margin-top:10px"><button class="btn small" id="copySummary" type="button">Copy</button></div></section>`}
      </div>
    </div>
    ${st.id==="apply"?`<section class="block" style="margin-top:20px"><h2><span class="k">D</span>profile.lua for the plugin</h2><p class="note" style="margin:0 0 10px">Every non-example printer on this sheet, keyed by its PrusaSlicer name. Save it as <code>profile.lua</code> in the bundle folder (${helper?"the helper does this for you":"copy it there by hand"}), then run <b>Plugins › Filament Dial-In › Tools › Apply values from profile.lua</b> on each printer instead of typing the values above. The towers also read the tag from it.</p><textarea class="summary-text" id="profileText" readonly spellcheck="false" style="width:100%;height:200px;resize:vertical">${esc(profileLua())}</textarea><div style="margin-top:10px;display:flex;gap:8px">${helper?`<button class="btn small primary" type="button" data-helper="profile">Save profile.lua to plugin</button>`:""}<button class="btn small" type="button" id="profileCopy">Copy</button></div></section>`:""}
    <div class="done-row"><label><input type="checkbox" id="doneBox" ${d.done?"checked":""}> Step ${st.n} done for ${esc(p.tag)}</label><div class="nav">${prev?`<button class="btn" type="button" data-go="${prev.id}">← ${prev.n}</button>`:""}${next?`<button class="btn primary" type="button" data-go="${next.id}">Next: ${next.n}. ${esc(next.name)} →</button>`:`<button class="btn primary" type="button" data-go="compare">Compare printers →</button>`}</div></div>`;
  $("#main").querySelectorAll("[data-field]").forEach(el => el.addEventListener("input", () => {
    const k = el.dataset.field; let v = el.value;
    if (el.tagName === "SELECT") v = v === "true"; else if (el.type === "number") v = v === "" ? "" : +v;
    sd(printer(), st.id)[k] = v; save();
    const r = $("#results"); if (r) r.innerHTML = resultsHtml(st, printer());
    const s = $("#summary"); if (s) s.textContent = summaryText(printer());
    if (st.id === "slab" || st.id === "coupon") refreshRun(st);
    renderRail();
  }));
  $("#doneBox").addEventListener("change", e => { sd(printer(), st.id).done = e.target.checked; save(); renderRail(); });
  const cs = $("#copySummary"); if (cs) cs.addEventListener("click", () => { navigator.clipboard && navigator.clipboard.writeText(summaryText(printer())).then(()=>toast("Copied")); });

function refreshRun(st){ const t = $("#main .vals"); if (t) t.innerHTML = st.run(printer()).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join(""); }
function summaryText(p){
  const t = num(sd(p,"temp").chosen), m = finalMultiplier(p), v = volLimit(p), o = num(sd(p,"overlap").chosen), r = barResult(p), foot = num(sd(p,"coupon").foot);
  return [
    `${p.name} (${p.tag}) · ${p.filament}`,
    `Filament preset (Apply command 9):`,
    `  temperature            ${t?f(t,0)+" C":"keep"}`,
    `  first layer temp       ${t?f(t-10,0)+" C":"keep"}`,
    `  extrusion multiplier   ${m?f(m,4):"keep"}`,
    `  max volumetric speed   ${v?f(v,1)+" mm3/s":"keep"}`,
    `  pressure advance       ${num(sd(p,"pa").chosen)!==null?f(sd(p,"pa").chosen,3)+" (mode: enabled)":"keep"}`,
    `Print preset:`,
    `  infill overlap         ${o?f(o,0)+" %":"keep"}`,
    `  fill density           100 % rectilinear`,
    `Per object / Advanced:`,
    `  xy size compensation   ${r.g!==null?f(-r.g,3)+" mm":"keep"}`,
    `  elephant foot          ${foot!==null?f(foot,2)+" mm":"keep"}`,
    `  scale models by        ${r.scale!==null?f(r.scale,4)+" (shrinkage "+f(r.s*100,2)+" %)":"1 (no bar measured)"}`
  ].join("\n");
}
function renderPrinter(){
  const p = printer();
  $("#main").innerHTML = `<div id="helperBar">${helperBar()}</div>
    <div class="sheet-head"><h1>Printer details</h1><div class="who"><b>${esc(p.name)}</b></div></div>
    <p class="purpose">These are the starting values the arithmetic uses. The current multiplier is what the filament preset had before you started; the slab result multiplies from it.${p.example?" This printer is an example with made-up measurements: edit it or add your own.":""}</p>
    <section class="block"><div class="printer-form">
      <div class="field"><label for="pf-name">Printer name<small>as PrusaSlicer shows it</small></label><input type="text" id="pf-name" data-p="name" value="${esc(p.name)}"></div>
      <div class="field"><label for="pf-tag">Tag engraved on parts<small>short, e.g. MK4S #3</small></label><input type="text" id="pf-tag" data-p="tag" value="${esc(p.tag)}"></div>
      <div class="field"><label for="pf-fil">Filament</label><input type="text" id="pf-fil" data-p="filament" value="${esc(p.filament)}"></div>
      <div class="field"><label for="pf-den">Filament density<small>g/cm³, Prusament PETG 1.27</small></label><input type="number" step="0.001" id="pf-den" data-p="density" value="${p.density}"></div>
      <div class="field"><label for="pf-mul">Current extrusion multiplier<small>from the preset before dialing in</small></label><input type="number" step="0.0001" id="pf-mul" data-p="baseMultiplier" value="${p.baseMultiplier}"></div>
      <div class="field"><label for="pf-noz">Nozzle</label><input type="number" step="0.05" id="pf-noz" data-p="nozzle" value="${p.nozzle}"></div>
      <div class="field"><label for="pf-lh">Layer height</label><input type="number" step="0.05" id="pf-lh" data-p="layer" value="${p.layer}"></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" id="resetBaseline" type="button">Reset baseline${p.baseline?` (now ${p.baseline.layer_height} mm, ${p.baseline.nozzle} nozzle, from step ${STEPS.findIndex(s=>s.id===p.baselineStep)+1})`:""}</button><button class="btn danger small" id="delPrinter" type="button">Remove this printer</button></div>
    <p class="note">The baseline is the layer height, nozzle and print profile recorded from the first PrusaSlicer run for this printer. Later runs that differ raise a warning on the step.</p></section>`;
  $("#resetBaseline").addEventListener("click", () => { const q = printer(); q.baseline = null; q.baselineStep = null; q.baselineWarning = null; q.lastSnapshot = null; save(); render(); toast("Baseline cleared; the next run sets it"); });
  $("#main").querySelectorAll("[data-p]").forEach(el => el.addEventListener("input", () => {
    const k = el.dataset.p; printer()[k] = el.type === "number" ? (+el.value || 0) : el.value; if (k !== "name" && k !== "tag" && k !== "filament") {} printer().example = false; save(); renderRail();
  }));
  $("#delPrinter").addEventListener("click", () => {
    if (state.printers.length === 1) { toast("Keep at least one printer"); return; }
    if (!confirm(`Remove ${p.name} and its measurements?`)) return;
    state.printers = state.printers.filter(x => x.id !== p.id); state.active = state.printers[0].id; state.step = "temp"; save(); render();
  });
}
function renderCompare(){
  const rows = state.printers.map(p => { const r = barResult(p); const m = finalMultiplier(p); const n = slabNominal(p); const ms = num(sd(p,"slab").measured);
    return `<tr><td>${esc(p.name)}<br><span class="tag" style="font-family:var(--mono);font-size:12px;color:var(--ink-3)">${esc(p.tag)}${p.example?" · example":""}</span></td><td>${num(sd(p,"temp").chosen)?f(sd(p,"temp").chosen,0):"—"}</td><td>${flowChosen(p)?f(flowChosen(p),0)+"%":"—"}</td><td>${ms?((ms/n.g-1)*100>0?"+":"")+f((ms/n.g-1)*100,2)+"%":"—"}</td><td>${m?f(m,4):"—"}</td><td>${volLimit(p)?f(volLimit(p),1):"—"}</td><td>${num(sd(p,"pa").chosen)!==null?f(sd(p,"pa").chosen,3):"—"}</td><td>${num(sd(p,"overlap").chosen)?f(sd(p,"overlap").chosen,0)+"%":"—"}</td><td>${r.g!==null?f(-r.g,3):"—"}</td><td>${r.s!==null?f(r.s*100,2)+"%":"—"}</td><td>${STEPS.filter(s=>sd(p,s.id).done).length}/${STEPS.length}</td></tr>`; }).join("");
  $("#main").innerHTML = `<div id="helperBar">${helperBar()}</div>
    <div class="sheet-head"><h1>Compare printers</h1><div class="who">${state.printers.length} printer${state.printers.length===1?"":"s"}</div></div>
    <p class="purpose">The spread between machines is the point. Temperature and multiplier normally differ by a few units; if the volumetric limit differs a lot, one hotend is not what its profile claims.</p>
    <section class="block compare"><table><thead><tr><th>Printer</th><th>Temp °C</th><th>M221</th><th>Slab error</th><th>Multiplier</th><th>Max mm³/s</th><th>PA</th><th>Overlap</th><th>XY comp mm</th><th>Shrink</th><th>Steps</th></tr></thead><tbody>${rows}</tbody></table></section>
    <p class="note">Export JSON to keep a copy or move the sheet to another machine. Values live in this browser only.</p>`;
}
function luaStr(v){ return '"' + String(v).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g," ") + '"'; }
function profileEntry(p){
  const t = num(sd(p,"temp").chosen), m = finalMultiplier(p), v = volLimit(p), o = num(sd(p,"overlap").chosen), r = barResult(p), foot = num(sd(p,"coupon").foot);
  const e = [["tag", luaStr(p.tag)]];
  if (p.layer) e.push(["layer_height", f(p.layer,3)]);
  if (p.nozzle) e.push(["nozzle", f(p.nozzle,2)]);
  if (t) { e.push(["temperature", f(t,0)]); e.push(["first_layer_temperature", f(t-10,0)]); }
  if (m) e.push(["extrusion_multiplier", f(m,4)]);
  if (v) e.push(["filament_max_volumetric_speed", f(v,1)]);
  if (num(sd(p,"pa").chosen)!==null) e.push(["pressure_advance", f(sd(p,"pa").chosen,3)]);
  if (o) e.push(["infill_overlap", luaStr(f(o,0)+"%")]);
  if (r.g !== null) e.push(["xy_size_compensation", f(-r.g,3)]);
  if (foot !== null) e.push(["elefant_foot_compensation", f(foot,2)]);
  return e;
}
function profileLua(){
  const lines = ["-- profile.lua: written by the PETG Dial-In Sheet on " + new Date().toISOString().slice(0,16).replace("T"," ") + ".",
    "-- Keyed by printer name as PrusaSlicer shows it. Read by every command for the tag,",
    "-- and by Tools > Apply values from profile.lua for the preset values.", "return {"];
  for (const p of state.printers) {
    if (p.example) continue;
    lines.push("  [" + luaStr(p.name) + "] = {");
    for (const [k, v] of profileEntry(p)) lines.push("    " + k + " = " + v + ",");
    lines.push("  },");
  }
  lines.push("}");
  return lines.join("\n");
}

// ---------- helper (localhost companion) ----------
let helper = null, helperSeen = 0;
async function api(path, body){
  const r = await fetch(path, body ? { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (j.status) helper = j.status; if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText); return j;
}
async function detectHelper(){
  if (!/^https?:/.test(location.protocol)) return;
  try { const r = await fetch("/api/status", {cache:"no-store"}); const j = await r.json(); if (j.helper) { helper = j; startLog(); document.body.classList.add("has-log"); render(); } } catch(e) {}
}
function helperBar(){
  if (!helper) return "";
  const h = helper;
  const dot = ok => `<span class="dot ${ok?"done":"partial"}"></span>`;
  return `<div class="helper">
    <span class="st">${dot(h.plugins_dir_exists)} plugins ${esc(h.plugins_dir || "not found")}</span>
    <span class="st">${dot(!!h.bundle_installed_version)} bundle ${h.bundle_installed_version ? "v"+esc(h.bundle_installed_version) + (h.bundle_installed_version!==h.bundle_source_version?" (source v"+esc(h.bundle_source_version)+")":"") : "not installed"}</span>
    <span class="st">${dot(h.profile_exists)} profile.lua ${h.profile_exists?"saved":"none"}</span>
    <span class="st">${dot(h.running)} PrusaSlicer ${h.running?"running":(h.prusaslicer_exists?"ready":"not found")}</span>
    <span class="grow"></span>
    <button class="btn small" type="button" data-helper="paths">Paths…</button>
    <button class="btn small" type="button" data-helper="install">${h.bundle_installed_version?"Update bundle":"Install bundle"}</button>
    <button class="btn small" type="button" data-helper="profile">Save profile.lua</button>
    <button class="btn small primary" type="button" data-helper="launch" ${h.running?"disabled":""}>Launch PrusaSlicer</button>
    ${h.looks_like_2x?`<span class="st" style="flex-basis:100%;color:var(--warn)">This PrusaSlicer path does not look like a 3.0 alpha. Use Paths… to point at the alpha's folder and its plugins folder (Plugins › Show User Plugins Folder inside the alpha).</span>`:""}
  </div>`;
}
async function helperAction(what){
  try {
    if (what === "paths") { openPaths(); return; }
    if (what === "install") { await api("/api/install", {}); toast("Bundle installed"); }
    else if (what === "profile") { await api("/api/profile", { lua: profileLua() }); toast("profile.lua saved into the plugin"); }
    else if (what === "launch") { await api("/api/launch", {}); toast("PrusaSlicer launched"); }
    render();
  } catch (e) { toast(e.message); render(); }
}
function openPaths(){
  const dlg = $("#pathsDialog");
  $("#pathPrusa").value = helper.prusaslicer || ""; $("#pathPlugins").value = helper.plugins_dir || "";
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}
function startLog(){
  const drawer = document.createElement("div"); drawer.className = "log"; drawer.id = "logDrawer";
  drawer.innerHTML = `<div class="bar" id="logBar"><span>PrusaSlicer output</span><span class="grow"></span><span id="logCount">0</span><span id="logToggle">hide</span></div><ol id="logList"></ol>`;
  document.body.appendChild(drawer);
  try { if (localStorage.getItem(KEY + ":logmin") === "1") drawer.classList.add("min"); } catch(e){}
  $("#logBar").addEventListener("click", () => { drawer.classList.toggle("min"); $("#logToggle").textContent = drawer.classList.contains("min") ? "show" : "hide"; try { localStorage.setItem(KEY + ":logmin", drawer.classList.contains("min") ? "1" : "0"); } catch(e){} });
  let n = 0;
  const es = new EventSource("/api/log?since=0");
  es.onmessage = e => {
    const ev = JSON.parse(e.data); if (ev.id <= helperSeen) return; helperSeen = ev.id;
    if (ev.kind === "slicer") return;
    n++; $("#logCount").textContent = n;
    const li = document.createElement("li"); li.className = "ev-" + ev.kind; li.textContent = (ev.kind === "data" ? "DATA " + JSON.stringify(ev.data) : ev.text); $("#logList").appendChild(li); $("#logList").scrollTop = 1e9;
    if (ev.kind === "data") onData(ev.data);
    if (ev.kind === "helper" && /launched|exited|installed|wrote/.test(ev.text)) fetch("/api/status").then(r=>r.json()).then(j=>{ helper=j; renderHelperBar(); }).catch(()=>{});
  };
}
function renderHelperBar(){ const el = $("#helperBar"); if (el) el.outerHTML = `<div id="helperBar">${helperBar()}</div>`; }
function onData(d){
  if (!d || !d.printer) return;
  let p = state.printers.find(x => x.name === d.printer);
  if (!p) { p = blankPrinter(d.printer, d.tag || d.printer.slice(0, 12)); state.printers.push(p); toast("Added " + d.printer + " from PrusaSlicer"); }
  else if (p.example) { p.steps = {}; p.example = false; if (d.tag) p.tag = d.tag; toast("Replaced the example's numbers with your " + d.printer); }
  else if (!p.tag && d.tag) p.tag = d.tag;
  state.active = p.id;
  const st = sd(p, d.step);
  if (d.layer_height) {
    const base = { layer_height: d.layer_height, nozzle: d.nozzle, perimeters: d.p_perimeters, top: d.p_top_solid_layers, bottom: d.p_bottom_solid_layers };
    if (!p.baseline) { p.baseline = base; p.baselineStep = d.step; p.layer = d.layer_height; if (d.nozzle) p.nozzle = d.nozzle; }
    else {
      const diffs = [];
      for (const [k, label] of [["layer_height","layer height"],["nozzle","nozzle"],["perimeters","perimeters"],["top","top solid layers"],["bottom","bottom solid layers"]])
        if (base[k] != null && p.baseline[k] != null && Math.abs(base[k] - p.baseline[k]) > 1e-6) diffs.push(`${label} ${p.baseline[k]} → ${base[k]}`);
      p.baselineWarning = diffs.length ? `The printer or print profile changed since step ${STEPS.findIndex(s=>s.id===p.baselineStep)+1}: ${diffs.join(", ")}. Every step must use the same printer, nozzle, layer height and print profile; change one variable at a time. Re-run this step, or reset the baseline in Printer details.` : null;
      if (p.baselineWarning) toast("Profile changed since the earlier steps");
    }
    p.lastSnapshot = { step: d.step, p_temperature: d.p_temperature, p_extrusion_multiplier: d.p_extrusion_multiplier, p_max_volumetric_speed: d.p_max_volumetric_speed, p_pressure_advance: d.p_pressure_advance };
  }
  if (d.baseline_mismatch) { p.baselineWarning = "PrusaSlicer reports: " + d.baseline_mismatch; toast("Layer height or nozzle differs from profile.lua"); }
  if (d.step === "slab") { st.x = d.x; st.y = d.y; st.z = d.z; st.posts = !!d.posts; if (d.density) p.density = d.density; if (d.extrusion_multiplier) st.printed_em = d.extrusion_multiplier; st.slicer_expected_g = d.expected_g; }
  if (d.step === "bar") { st.c0 = d.c0; st.w0 = d.width; st.d0 = d.hole; }
  if (d.step === "coupon") { st.l0 = d.length; st.w0 = d.width; st.h0 = d.height; st.hole0 = d.hole; if (d.foot) st.foot = d.foot; }
  if (d.step === "flow" && d.extrusion_multiplier) p.baseMultiplier = d.extrusion_multiplier;
  if (STEPS.some(s => s.id === d.step)) state.step = d.step;
  save(); render();
}

function render(){
  renderRail();
  const st = STEPS.find(s => s.id === state.step);
  if (st) renderStep(st); else if (state.step === "printer") renderPrinter(); else renderCompare();
  save();
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 1600); }

// ---------- events ----------
document.addEventListener("click", e => {
  const pb = e.target.closest("[data-printer]"); if (pb) { state.active = pb.dataset.printer; render(); return; }
  const sb = e.target.closest("[data-step]"); if (sb) { state.step = sb.dataset.step; render(); window.scrollTo({top:0}); return; }
  const go = e.target.closest("[data-go]"); if (go) { state.step = go.dataset.go; render(); window.scrollTo({top:0}); return; }
  const hb = e.target.closest("[data-helper]"); if (hb) { helperAction(hb.dataset.helper); return; }
  const pc = e.target.closest("#profileCopy"); if (pc) { const t = $("#profileText"); navigator.clipboard && navigator.clipboard.writeText(t.value).then(()=>toast("Copied profile.lua")); return; }
});
$("#addPrinter").addEventListener("click", () => {
  const name = prompt("Printer name as PrusaSlicer shows it", "Original Prusa MK4S 0.4 nozzle"); if (!name) return;
  const tag = prompt("Short tag to engrave on parts", "MK4S #" + (state.printers.length + 1)) || name.slice(0, 12);
  const p = blankPrinter(name.trim(), tag.trim()); state.printers.push(p); state.active = p.id; state.step = "printer"; render();
});
$("#exportBtn").addEventListener("click", () => {
  const json = JSON.stringify(state, null, 2);
  const dlg = $("#exportDialog"); $("#exportText").value = json;
  if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
});
$("#exportCopy").addEventListener("click", () => {
  const ta = $("#exportText"); ta.select();
  const done = () => toast("Copied");
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { document.execCommand("copy"); done(); });
  else { document.execCommand("copy"); done(); }
});
$("#exportClose").addEventListener("click", () => { const dlg = $("#exportDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
$("#pathsClose").addEventListener("click", () => { const dlg = $("#pathsDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); });
$("#pathsSave").addEventListener("click", async () => {
  try { await api("/api/config", { prusaslicer: $("#pathPrusa").value.trim(), plugins_dir: $("#pathPlugins").value.trim() }); toast("Paths saved"); const dlg = $("#pathsDialog"); dlg.close ? dlg.close() : dlg.removeAttribute("open"); render(); }
  catch (e) { toast(e.message); }
});
$("#importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => { const s = JSON.parse(t); if (!s.printers) throw new Error("no printers"); state = s; state.step = state.step || "temp"; save(); render(); toast("Imported"); }).catch(() => toast("That file is not a dial-in sheet export"));
  e.target.value = "";
});
$("#resetBtn").addEventListener("click", () => { if (confirm("Clear every printer and measurement in this browser?")) { state = { printers:[examplePrinter()], active:"ex1", step:"temp" }; save(); render(); } });
$("#railToggle").addEventListener("click", () => $("#rail").classList.toggle("collapsed"));
if (window.matchMedia("(max-width:760px)").matches) $("#rail").classList.add("collapsed");

render();
detectHelper();
})();
</script>
</body>
